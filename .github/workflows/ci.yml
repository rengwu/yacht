name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift run UsageCoreTests
      - run: command -v jq >/dev/null || brew install jq
      - run: bash tap/test_tap.sh
