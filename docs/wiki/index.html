und updates plus refresh on opening. Exact polling intervals and resource budgets remain implementation questions.\u003c/li>\n\u003cli>Failed refresh with a previous reading: preserve that reading with a visible stale marker and age.\u003c/li>\n\u003cli>After a cached reset time passes: show an unknown percentage and reset-passed/awaiting-update state until new data arrives.\u003c/li>\n\u003cli>No usage notifications; indicators remain visual.\u003c/li>\n\u003c/ul>\n\u003cp>The \u003ca href=\"#/journal/2026-10-20-grill-6f40375f-6228-48e1-972d-055c180fcfbe\">round 3 answers\u003c/a> complete the pre-mockup behavior discussion:\u003c/p>\n\u003cul>\n\u003cli>Each account's menu bar figure uses one quota window chosen by the user. Multiple figures for different windows of the same account are not requested.\u003c/li>\n\u003cli>Entry identity is customizable: an editable per-entry label and the ability to enable the provider icon per entry. Do not impose a mandatory provider icon or email identity. The original implementation is a reference for customization, not an approved layout. \u003cem>Revised in mockup round 2 review:\u003c/em> icons are all-or-none, not per entry (see \u003ca href=\"#/plan~mockup-review\">Mockup review\u003c/a>).\u003c/li>\n\u003cli>Account setup must support multiple accounts from the same provider. The user asked for the cleanest implementation under jstack's \u003ccode>rule-lean\u003c/code>, rather than selecting an onboarding option; see the recommendation below.\u003c/li>\n\u003cli>The dropdown monitors usage, with refresh and settings. Keep the scope simple and add no invented features.\u003c/li>\n\u003cli>Reset-display choices are countdown or exact time, with no combined mode.\u003c/li>\n\u003cli>Apply jstack's \u003ccode>rule-lean\u003c/code> to relevant implementation decisions.\u003c/li>\n\u003c/ul>\n\u003cp>The \u003ca href=\"#/journal/2026-10-20-grill-1664761b-a44e-468f-a6d4-1ce37f6b63ad\">round 4 answers\u003c/a> settle choices raised by the mockups:\u003c/p>\n\u003cul>\n\u003cli>Provider icons come from Lobe Icons, with letter tiles as the fallback for a provider without a mark.\u003c/li>\n\u003cli>One \"Show accounts as: Icons / Labels\" setting controls both the menu bar and the dropdown. Icons gives menu bar style 2 (icon + percentage) and an icon beside each dropdown label. Labels gives style 4 (label over percentage) and labels only.\u003c/li>\n\u003cli>Defaults: show accounts as labels; percentages as used; resets as a countdown.\u003c/li>\n\u003cli>A stale figure in the menu bar is dimmed only. The dropdown keeps the clock glyph with the age.\u003c/li>\n\u003cli>Meter colour uses configurable thresholds (details in round 5).\u003c/li>\n\u003cli>The dropdown keeps \"Quit Yacht\".\u003c/li>\n\u003cli>Local-profile account setup is accepted (below).\u003c/li>\n\u003c/ul>\n\u003cp>The \u003ca href=\"#/journal/2026-10-20-grill-94e43e24-0344-4592-9f1e-8eee6e7b6cb6\">round 5 answers\u003c/a> complete the visual states:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Reset passed:\u003c/strong> an hourglass glyph replaces the percentage and the meter becomes a dashed track. The glyph is neutral grey. Natively this is the SF Symbol \u003ccode>hourglass\u003c/code>.\u003c/li>\n\u003cli>\u003cstrong>Thresholds:\u003c/strong> keep the existing model. One warning threshold is set by a slider (50–95% used, default 75%); critical is derived halfway to 100%, so the two can never be out of order. Thresholds are stored as usage used, and the Settings label follows the chosen percentage convention.\u003c/li>\n\u003cli>\u003cstrong>Colour reach:\u003c/strong> threshold colours apply to both the dropdown meters and the menu bar figures. In icons mode the icon stays monochrome and only the percentage is coloured.\u003c/li>\n\u003cli>\u003cstrong>Precedence:\u003c/strong> a warning colour overrides stale dimming (the existing behaviour). Below the threshold, a stale reading still dims.\u003c/li>\n\u003cli>\u003cstrong>Colours:\u003c/strong> fixed system orange for warning and red for critical, which adapt to light mode, dark mode, and accessibility contrast.\u003c/li>\n\u003cli>\u003cstrong>Normal meters:\u003c/strong> neutral text colour, so colour appears only when something needs attention.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"native-build-review\">Native build review\u003c/h3>\n\u003cp>The user's follow-up review requests muted separators between account groups and immediate editing when clicking a label field. It also removes the elapsed stale age (such as \u003ccode>19m\u003c/code>) from the dropdown header; the clock glyph remains. This supersedes the earlier clock-plus-age presentation. In the two-line menu bar style, the figure moves down one point (two Retina pixels) to increase the gap beneath its label.\u003c/p>\n\u003cp>The next review replaces the reset-passed hourglass with a muted dash in both the menu bar and dropdown. Expired/no-data accounts should look similar to awaiting-refresh accounts: use the same dashed meter, dash alignment, and row height. With no reported windows, the dropdown uses an unlabelled placeholder row rather than adding a fabricated window to the model. Hover help retains the specific cause.\u003c/p>\n\u003ch3 id=\"accounts-table-refinement\">Accounts table refinement\u003c/h3>\n\u003cp>\u003cstrong>0.2.0 is released.\u003c/strong> After merging PR #1, the user instructed “i merged. lets release,” resolving the pending publication decision. The tag workflow and downloaded-asset checks passed; see the \u003ca href=\"#/verification/runs/2026-10-21-v0.2.0-publication\">publication record\u003c/a>. The earlier \u003ca href=\"#/verification/runs/2026-10-21-v0.2.0-preflight\">release preflight\u003c/a> retains its scope and limits: fresh Kimi verification remains untested because the saved CLI sessions were expired.\u003c/p>\n\u003cp>The \u003ca href=\"#/journal/2026-10-20-grill-38baa3c1-ee26-4927-a545-81600f42bc14\">table review\u003c/a> selects compact layout A over the version showing every folder path. Keep the selected folder in the bottom bar, native row selection, reordering, provider identity, and each account's menu-bar window choice.\u003c/p>\n\u003cp>The label editor starts at a small minimum width and grows with the entered text, instead of filling the Account column. The native implementation uses 72 pt as the minimum and caps growth at the column boundary; these measurements are assistant-chosen implementation details, not separate user requirements. Keep immediate first-click editing and show the field border only while editing.\u003c/p>\n\u003cp>The grouped lists in macOS \u003cstrong>Input Monitoring\u003c/strong> and \u003cstrong>Developer Tools\u003c/strong> guide the rounded container, uniform row backgrounds, inset separators, and integrated add/remove footer. The user approved the refinement, then explicitly asked not to overcomplicate or overfit it. The later instruction to follow Apple’s native guidelines takes precedence over matching screenshot details. Yacht uses NSTableView’s standard headers, separators, selection, and column resizing, plus semantic system colors. Custom header/separator drawing was removed, and scrollbars follow the system preference. The drag handles stay quietly visible; there is no hover-specific behavior or custom light/dark palette. The screenshots do not establish which public control or internal implementation System Settings uses.\u003c/p>\n\u003cp>The selected Claude account's existing Install/Replace Tap action remains available in the footer when needed. Up to six rows are visible before scrolling. The window fits the settings content and adjusts when accounts are added or removed, leaving a normal bottom margin.\u003c/p>\n\u003cp>Follow-up feedback adds breathing room inside the column headings and removes the stray divider at the group's trailing edge. Header titles have an 8 pt text inset; AppKit still renders the header, handles column resizing, and supplies its appearance. The corner above the scrollbar uses a matching native header view.\u003c/p>\n\u003cp>The user tried AppKit's gap feedback for reordering, then rejected how it felt. The table returns to AppKit's default insertion indicator. Account order is still saved only when the row is dropped; the row alignment fix remains.\u003c/p>\n\u003cp>The submitted preview state records interaction with fictional sample accounts. Its removal of Codex and addition of Client are not instructions to change real account registrations.\u003c/p>\n\u003ch2 id=\"account-setup\">Account setup\u003c/h2>\n\u003cp>\u003cstrong>Accepted in round 4\u003c/strong> (previously a recommendation): retain local profile registration. Choose the provider, select an existing account/config folder, and assign a label. Use a different folder for each account from the same provider. Retain existing discovery as an optional shortcut into the same registration path.\u003c/p>\n\u003cp>This is the simplest complete fit for the established monitoring task because the current account model and provider adapters already use local folders. Reusing that path preserves multiple accounts without introducing a new credential lifecycle. The provider's existing tools remain responsible for signing in and preparing each profile. Selecting a folder does not itself create or authenticate an account.\u003c/p>\n\u003cp>Observed in the current source:\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>Sources/UsageCore/Model.swift\u003c/code> stores provider, label, and config directory per account. Separate local profiles can belong to the same provider.\u003c/li>\n\u003cli>\u003ccode>Sources/Yacht/SettingsWindowController.swift\u003c/code> already offers provider selection and a native folder picker, and registers discovered folders through the same function.\u003c/li>\n\u003cli>\u003ccode>Sources/UsageCore/AppConfig.swift\u003c/code> discovers the standard profile folders for all four providers: \u003ccode>.claude*\u003c/code>, \u003ccode>.codex*\u003c/code>, \u003ccode>.kimi-code*\u003c/code>, and \u003ccode>.grok*\u003c/code> directories under the user's home. Codex and Kimi discovery were added after the user's fresh-start tests exposed the missing paths. Kimi also lists legacy \u003ccode>.kimi*\u003c/code> folders containing \u003ccode>credentials/kimi-code.json\u003c/code>, after the current Code homes; this finds older signed-in profiles without including unrelated folders such as \u003ccode>.kimi-webbridge\u003c/code>. Discovery is a convenience, not proof of valid credentials; the manual path supports other/custom locations.\u003c/li>\n\u003c/ul>\n\u003cp>Following \u003ccode>rule-lean\u003c/code>, reuse that implementation where it fits rather than expanding discovery or sign-in scope for hypothetical needs. Do not assume universal provider discovery.\u003c/p>\n\u003ch2 id=\"mockup-review\">Mockup review\u003c/h2>\n\u003cp>The mockups are on a private design canvas: \u003ca href=\"https://claude.ai/artifact/E9ZV6c1fjk6HKqyCJ9pMSM\" rel=\"noreferrer\">https://claude.ai/artifact/E9ZV6c1fjk6HKqyCJ9pMSM\u003c/a>. Each round has its own page. All data on it is fictional. Round 3 uses real provider marks from Lobe Icons and Hugeicons (both MIT-licensed; the logos remain their owners' trademarks).\u003c/p>\n\u003cp>Round 1 feedback (2026-10-20):\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Closed menu bar:\u003c/strong> the user liked style 2 (provider icon + percentage) and style 4 (two lines: label over value). Label + percentage and icon + label + percentage were not chosen. No final style has been selected.\u003c/li>\n\u003cli>\u003cstrong>Dropdown:\u003c/strong> accepted direction is layout C. Each account name is followed by one row per reported window, with a meter, percentage, and reset. The plain menu (A) and compact table (B) were not chosen.\u003c/li>\n\u003cli>\u003cstrong>Data states:\u003c/strong> the user does not want many words in the UI. Indicators should be compact icons, dots, or glyphs.\u003c/li>\n\u003cli>\u003cstrong>Settings:\u003c/strong> the user said the Settings layout \"seems okay\". That layout has an account list with per-entry icon toggle, label, provider, and menu bar window. It also has percentage and reset-time controls and launch at login. The add-account sheet appeared in the same review screenshot but was not singled out, so the local-profile recommendation still awaits explicit approval.\u003c/li>\n\u003c/ul>\n\u003cp>Round 2 proposals, not yet accepted:\u003c/p>\n\u003cul>\n\u003cli>A merged menu bar style: icon or label over the value, chosen by the per-entry icon setting. It fits eight accounts beside the notch.\u003c/li>\n\u003cli>Layout C with fewer words: bare percentages and reset values, without \"left\" or \"in\". The words \"left\" and \"used\" come from the setting.\u003c/li>\n\u003cli>Glyph states: stale is dimmed, with a clock glyph and age. Reset passed shows \u003ccode>?\u003c/code> with an awaiting-update glyph. No data shows a dash and no windows.\u003c/li>\n\u003c/ul>\n\u003cp>Round 2 feedback (2026-10-20):\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Menu bar:\u003c/strong> style 2 (icons + percentage) and style 4 (labels over values) are both good. Never merge different styles; the merged style is rejected.\u003c/li>\n\u003cli>\u003cstrong>No mixing:\u003c/strong> either every entry shows an icon or none does. This replaces the round 3 per-entry icon toggle, because a bar that mixes icons and labels reads as inconsistent.\u003c/li>\n\u003cli>\u003cstrong>Provider icons:\u003c/strong> use real provider marks, with letter tiles kept as the fallback. Lucide has none. Hugeicons (free) has Claude, ChatGPT, Grok, and Kimi but no Codex. Lobe Icons has all four.\u003c/li>\n\u003cli>\u003cstrong>Dropdown:\u003c/strong> layout C with fewer words looks great, subject to the all-or-none icon rule.\u003c/li>\n\u003cli>\u003cstrong>Reset passed:\u003c/strong> the refresh-arrow glyph is rejected because it can be confused with a refresh button. The \u003ccode>?\u003c/code> glyph is rejected in favour of a better glyph.\u003c/li>\n\u003c/ul>\n\u003cp>Round 3 proposals and their outcome in interview round 4:\u003c/p>\n\u003cul>\n\u003cli>A single \"Show accounts as: Icons / Labels\" setting. \u003cstrong>Accepted\u003c/strong>, defaulting to labels.\u003c/li>\n\u003cli>Icon source. \u003cstrong>Lobe Icons accepted\u003c/strong> over Hugeicons, with letter tiles as the fallback.\u003c/li>\n\u003cli>Reset-passed glyph options: hourglass, three dots, or a dashed ring. \u003cstrong>Hourglass accepted\u003c/strong> in interview round 5. The stale clock and the no-data dash are unchanged.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"superseded-proposal\">Superseded proposal\u003c/h2>\n\u003cp>The assistant implemented a SwiftUI dashboard, usage-card popover, sidebar settings, visual branding, and a preview app before eliciting requirements. On 2026-10-20 the user rejected that direction and requested a first-principles discussion. None of those design choices are accepted requirements.\u003c/p>\n\u003ch2 id=\"cleanup-baseline-before-native-implementation\">Cleanup baseline (before native implementation)\u003c/h2>\n\u003cul>\n\u003cli>The checked-out branch is \u003ccode>redesign/native-dashboard\u003c/code>.\u003c/li>\n\u003cli>The rejected redesign source, tests, screenshots, and preview build have been removed from the working tree. The preview process was stopped.\u003c/li>\n\u003cli>Grok support was already present as uncommitted work before the redesign began.\u003c/li>\n\u003cli>At the cleanup checkpoint, the tracked diff matched the initial scope and size: 10 files, 228 insertions, 35 deletions. The pre-existing Grok adapter, Grok tests, model, rendering, and other provider/config tests were verified unchanged by content hashes; restored README, config, and settings files also matched their pre-redesign Git blob hashes. The subsequent native implementation extends this baseline and is also uncommitted.\u003c/li>\n\u003cli>A recovery copy of the rejected edits is outside the project at \u003ccode>/var/folders/00/h_k67s0j5dq0qvg6ylqysk2w0000gn/T/yacht-rejected-redesign-q96kmw06\u003c/code>. It is not an active implementation or an accepted design.\u003c/li>\n\u003cli>The new project wiki was retained as requested. No replacement interface was implemented during the interview; native implementation began after the design review.\u003c/li>\n\u003cli>Cleanup validation: \u003ccode>swift build\u003c/code> succeeded; \u003ccode>swift run UsageCoreTests\u003c/code> returned 405 passes and zero failures; \u003ccode>./build.sh\u003c/code> rebuilt the earlier app successfully. This verifies the cleanup, not a replacement design.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"design-handoff\">Design handoff\u003c/h2>\n\u003cp>The \u003ca href=\"#/design-handoff\">design handoff\u003c/a> is the entry point for implementation. It is the build specification for the accepted design and links back here for decisions. The final mockups are on the canvas's \u003cstrong>Final\u003c/strong> page. The earlier \u003ca href=\"#/mockup-handoff\">mockup handoff\u003c/a> is complete and kept as history.\u003c/p>\n\u003ch2 id=\"implementation-decisions\">Implementation decisions\u003c/h2>\n\u003cp>The user explicitly delegated discretion on 2026-10-20 while reiterating native implementation. This supersedes the handoff's request to seek separate approval for routine implementation choices:\u003c/p>\n\u003cul>\n\u003cli>AppKit throughout: one system status item and NSMenu, native text/image/meter views, NSTableView for account reordering, standard controls, and an Add Account sheet.\u003c/li>\n\u003cli>Bundle four preconverted PDF vectors and the Lobe MIT notice. SwiftPM and \u003ccode>build.sh\u003c/code> include them; there is no network icon loading or runtime SVG dependency.\u003c/li>\n\u003cli>Retain existing adaptive provider schedules (roughly 60 seconds active / 15 minutes idle), with refresh on opening and manual refresh. Replace the fixed five-second redraw with a single timer for the next minute or quota reset. Provider callbacks still update immediately.\u003c/li>\n\u003cli>Keep system semantic colors. Exact spacing, the 320 pt dropdown width, standard menu behavior, and the sheet layout follow native controls rather than reproducing browser CSS.\u003c/li>\n\u003cli>Keep existing account registrations, provider integrations, executable overrides, thresholds, and legacy configuration fields. The new interface uses structured presentation rather than the old text templates.\u003c/li>\n\u003cli>Keep the last in-process Claude snapshot when a subsequent file read fails, visibly marked stale. The established pulled-provider caches remain unchanged.\u003c/li>\n\u003c/ul>\n\u003cp>No measured live-provider CPU/memory/wakeup guarantee is claimed. Offline UI measurements and remaining verification limits belong in the implementation page.\u003c/p>\n\u003cp>When figures exceed the space beside the notch, macOS may hide the status item. Reopening Yacht opens Settings, where the accepted per-account \"Off\" option reduces its width; no automatic truncation has been requested. Provider setup requirements must be verified before changing the existing integration paths.\u003c/p>\n\u003ch2 id=\"decision-history\">Decision history\u003c/h2>\n\u003cul>\n\u003cli>2026-10-20: User rejected the dashboard redesign, reiterated lightweight/minimal/native Swift, and requested a reset through grill-form.\u003c/li>\n\u003cli>2026-10-20: User identified \u003ccode>../jstack\u003c/code> as the skill source and explicitly adopted wiki, plan, and grill-form for this project.\u003c/li>\n\u003cli>2026-10-20: Round 1 settled the primary usage/reset job, personal audience, resource/UI constraints, SwiftUI permissibility, dropdown-and-settings boundary, four-to-eight-account target, four-provider scope, and selective cleanup. The rejected redesign was removed within that boundary.\u003c/li>\n\u003cli>2026-10-20: Round 2 settled customizable multi-account menu bar figures, selectable percentage convention, all reported windows, a user-ordered flat account list, adaptive updates, explicit stale/expired states, and no notifications. The user requested rough layout alternatives and plans to hand mockup design to another session. A short final round addresses behavior needed for those mockups.\u003c/li>\n\u003cli>2026-10-20: Round 3 settled one chosen menu bar window per account, per-entry label/icon customization, monitoring-only actions, and countdown-or-exact reset modes. The user invoked \u003ccode>rule-lean\u003c/code> and requested setup advice while preserving same-provider multi-account support. Source review supports recommending the existing local-profile registration path; that recommendation remains open for mockup review. The handoff is ready.\u003c/li>\n\u003cli>2026-10-20: Mockup round 1 reviewed. Menu bar narrowed to icon + percentage and two-line styles; dropdown layout C accepted as the direction; Settings layout judged okay; state indicators should use glyphs rather than words. Round 2 mockups were added for review.\u003c/li>\n\u003cli>2026-10-20: Mockup round 2 reviewed. Menu bar styles 2 and 4 are both accepted, with no merging and no mixing of icons and labels; the per-entry icon toggle is replaced by all-or-none. Real provider marks are requested, with letter fallback. The refresh-arrow and \u003ccode>?\u003c/code> reset-passed glyphs are rejected. Round 3 mockups were added for review.\u003c/li>\n\u003cli>2026-10-20: Interview round 4 settled Lobe Icons, one icons-or-labels setting, the defaults (labels, used, countdown), dim-only stale figures in the menu bar, configurable colour thresholds, keeping Quit, and local-profile account setup. The reset-passed glyph is held until the options can be shown visually.\u003c/li>\n\u003cli>2026-10-20: Interview round 5 accepted the hourglass glyph for a passed reset. It kept the existing single warning threshold with critical derived, applied threshold colours to meters and menu bar figures, and let warnings override stale dimming. It also fixed system orange and red as the colours and made normal meters neutral. Design questions are closed.\u003c/li>\n\u003cli>2026-10-20: A final mockup was added to the canvas's Final page, and the \u003ca href=\"#/design-handoff\">design handoff\u003c/a> was written for another agent to implement. Assistant-chosen details are marked there as not separately reviewed: the grey stale clock (orange is reserved for warnings), sizes, and opacities.\u003c/li>\n\u003cli>2026-10-20: User supplied the exact Final page, described it as a mockup, delegated discretion, and required native implementation. All eight boards were visually inspected. The design was implemented with AppKit, preserving provider work; see the implementation page for validation.\u003c/li>\n\u003cli>2026-10-20: User reopened the Accounts table design, supplied the macOS Sound device table as a reference, and requested a couple of mock redesigns through the updated jstack grill-form. Two interactive studies were created and visually inspected in the default browser. Feedback is pending; no app code or registrations changed for this review.\u003c/li>\n\u003cli>2026-10-20: Table review submitted: A selected, with a content-sized label editor and the Input Monitoring grouped table as the specific reference. Both attached images were inspected. A revised mockup was prepared, preserving the user's fictional preview state; native app implementation remains pending.\u003c/li>\n\u003cli>2026-10-21: Refined table approved for implementation. The user reinforced \u003ccode>rule-lean\u003c/code> with the Developer Tools list as a simplicity reference. The compact AppKit table is implemented. A final instruction prioritizes Apple’s native guidelines over custom styling; validation and remaining limits are recorded on the native implementation page.\u003c/li>\n\u003cli>2026-10-21: User merged PR #1 and directly authorized release, superseding the pending release-choice form. Published v0.2.0 from merged commit \u003ccode>e3b7293\u003c/code>. The user also supplied a screenshot for the README; it was added unchanged and pushed separately from the release tag.\u003c/li>\n\u003c/ul>\n","backlinks":["index","design-handoff","mockup-handoff"]},{"id":"design-handoff","title":"Design handoff","section":"Overview","order":2,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-21\u003c/span>","updated":"2026-10-21","summary":"","source":"---\ntitle: Design handoff\nupdated: 2026-10-21\norder: 2\n---\n\n# Design handoff\n\nStart here to implement the accepted design. This page is the build specification. [The plan](plan.md) remains the authority for decisions, their reasons and their history. Where the two differ, the plan wins; report the difference rather than guessing.\n\nImplementation update: the user subsequently delegated discretion while requiring a native app. The [plan](plan.md#implementation-decisions) records the AppKit and resource choices; [native implementation](native-implementation.md) records validation. Sizes and browser styling here are visual guidance, not pixel-exact native requirements.\n\nThe final mockups are on the **Final** page of the design canvas: \u003chttps://claude.ai/artifact/E9ZV6c1fjk6HKqyCJ9pMSM>. The canvas is private to the owner's account. If you cannot open it, ask the user to share it; this page is written so the build does not depend on it. All accounts, percentages and times on the canvas are fictional fixture data.\n\n## Scope\n\nBuild exactly four surfaces: the menu bar status item, its dropdown, the Settings window, and the Add Account sheet. There is no dashboard, account-detail window, notification, or onboarding flow. The dropdown's only actions are Refresh, Settings… and Quit Yacht.\n\nThe existing code is a factual reference, not a layout to keep. Apply `../jstack` `rule-lean`. Reuse the account model, provider adapters, threshold logic and folder registration where they fit, rather than rebuilding them.\n\n## Menu bar\n\nOne status item shows one entry per account, in the user's order. Accounts whose menu bar window is set to Off are left out. Each entry shows the window the user chose for that account.\n\n| Setting | Entry layout |\n| --- | --- |\n| Show accounts as: **Labels** (default) | Two lines, centred: label at about 9 pt regular, over the percentage at about 11 pt semibold |\n| Show accounts as: **Icons** | Provider mark (14 pt monochrome template image), then the percentage at 13 pt |\n\n- Entries are about 10 pt apart.\n- Never mix icons and labels within the bar, and never combine the two layouts.\n- The percentage follows the Percentages setting: used (default) or remaining.\n- Threshold colour applies to the percentage only. In Icons mode the mark stays monochrome.\n- When the item is too wide for the space beside the notch, macOS hides it. The remedy is setting some accounts' menu bar window to Off. No automatic truncation has been requested.\n\n## Dropdown\n\nThis is layout C, with no section headers, grouping or expansion. Accounts appear in the user's order. Each block is:\n\n1. **Header:** the provider mark (Icons mode only), then the label at 13 pt semibold. On the right, a stale reading shows a clock glyph in secondary colour, without elapsed-time text (revised during native build review).\n2. **One row per window the provider reports,** in the adapter's order (5h before Weekly). Do not invent missing windows. Columns:\n   - window name in secondary text, about 12 pt;\n   - a meter about 4 pt high with rounded ends, filled to the displayed percentage;\n   - the percentage, right-aligned, with no \"left\" or \"used\" suffix;\n   - the reset value, right-aligned, in secondary text.\n\nReset values are either a countdown (`2h 14m`, `3d 4h`, `22h 0m`) or an exact time (`11:55` today, `Fri 13:40` on another day), chosen by the Reset times setting. The two are never combined.\n\nIf there is no reading, show one unlabelled placeholder row with a muted dashed meter and a dash in the percentage column. This gives expired credentials and awaiting-refresh states the same visual structure without claiming a quota window or reset time that has not been reported.\n\nMuted native separators divide the account groups. After the accounts come a separator and **Refresh** (⌘R), **Settings…** (⌘,) and **Quit Yacht** (⌘Q). The mockup's menu is about 300 pt wide.\n\n## States and colours\n\nThe thresholds apply to usage **used**, whichever convention is displayed. The warning threshold is the Settings value (default 75%). Critical is derived as `warn + (100 − warn) / 2`, so 87.5% by default. This matches `AppSettings.criticalThreshold` in `Sources/UsageCore/Model.swift` and `tone`/`barTone` in `Sources/UsageCore/ViewModel.swift`.\n\n| State | Trigger | Menu bar entry | Dropdown |\n| --- | --- | --- | --- |\n| Normal | Below the warning threshold | Default text colour | Neutral meter (`labelColor`) and default text |\n| Warning | At or above the warning threshold | Percentage in `systemOrange` | Meter and percentage in `systemOrange` |\n| Critical | At or above the critical threshold | Percentage in `systemRed` | Meter and percentage in `systemRed` |\n| Stale | Refresh failed; previous reading kept | Dimmed (about 40% opacity) | Clock glyph in the header; rows dimmed (about 50%) |\n| Stale + threshold | Stale and at or above warning | Colour wins; not dimmed | Coloured rows are not dimmed; the clock still shows |\n| Reset passed | The cached reset time has passed and no new data has arrived | Muted `—` replaces the percentage | Muted `—` in the percentage column; dashed meter track; no reset value |\n| No data | No reading, including expired credentials without a saved reading | Muted `—` | Unlabelled placeholder row with the same dashed meter and muted `—`; no reset value |\n\nUse the SF Symbol `clock` for the stale marker. Use system colours, not fixed hex values, so light mode, dark mode and Increase Contrast adapt automatically. The canvas approximates them.\n\n## Settings window\n\nUse one window with three grouped sections:\n\n- **Accounts:** a compact, single-line reorderable table (layout A, selected in the [table review](journal/2026-10-20-grill-38baa3c1-ee26-4927-a545-81600f42bc14.md) and [approved after refinement](journal/2026-10-20-grill-21c6d8e7-5273-49e5-9839-1436d77ca537.md)). This is implemented in AppKit and supersedes the earlier two-line rows. Dragging sets the order of both the dropdown and the menu bar. Each row has:\n  - a drag handle and the provider mark;\n  - an editable label that looks like plain text when idle. On first click, its editor starts at a small minimum width and grows with the text, capped at the available Account column;\n  - the provider name;\n  - a **Menu bar** pop-up listing the windows that provider reports, plus **Off**.\n\n  Show the selected account's folder in the bottom bar. `+` opens the Add Account sheet and `−` removes the selected account. The selected Claude account's Install/Replace Tap action also appears here when needed. Use a rounded group, uniform row backgrounds, and an integrated footer, guided by macOS Input Monitoring and Developer Tools. The user’s final instruction prioritizes Apple’s native guidelines over matching screenshot details: use standard AppKit table headers, separators, selection, resizable columns, and system colors. See [Accounts table refinement](plan.md#accounts-table-refinement).\n- **Display:**\n  - **Show accounts as:** Icons / **Labels**.\n  - **Percentages:** Remaining / **Used**.\n  - **Reset times:** **Countdown** / Exact time.\n  - **Warning threshold:** a slider from 50 to 95, default 75. Its caption reads \"orange at 75%, red at 87% used\". With remaining selected, it reads in that convention (for example, \"orange at 25% left\").\n  - **Menu bar preview** showing the current figures.\n- **General:** Launch at login.\n\nThe existing `Sources/Yacht/SettingsWindowController.swift` already has the threshold slider, its caption, the folder picker, and Launch at login.\n\n## Add Account sheet\n\nThis is the accepted local-profile flow. The fields are:\n\n- **Provider:** pop-up.\n- **Folder:** field plus **Choose…**.\n- **Label:** field.\n\nUnder the fields is one line of help: choose the folder the provider's own CLI already signs in to; Yacht only reads it; each account of the same provider uses its own folder.\n\nA **Found on this Mac** list offers discovered folders. Each shows **Use**, or \"Added as \u003clabel>\" if it is already registered. The buttons are **Cancel** and **Add Account** (default).\n\nClaude accounts then offer Install Tap, as the current app does. Selecting a folder does not create or authenticate an account. See [Account setup](plan.md#account-setup).\n\n## Defaults\n\n| Setting | Default | Status |\n| --- | --- | --- |\n| Show accounts as | Labels | Accepted (round 4) |\n| Percentages | Used | Accepted (round 4) |\n| Reset times | Countdown | Accepted (round 4) |\n| Warning threshold | 75% used | Accepted (round 5; existing value) |\n| Menu bar window per account | The adapter's declared primary: 5h for Claude and Kimi, weekly for Codex and Grok | Existing behaviour; not separately reviewed |\n| Launch at login | Existing behaviour | Not separately reviewed |\n\n## Provider marks\n\nUse [Lobe Icons](https://github.com/lobehub/lobe-icons) (MIT), package `@lobehub/icons-static-svg` 1.95.1. The files are `icons/claude.svg`, `icons/codex.svg`, `icons/grok.svg` and `icons/kimi.svg`, for example \u003chttps://cdn.jsdelivr.net/npm/@lobehub/icons-static-svg@1.95.1/icons/claude.svg>. Each is a single-colour 24×24 path. The logos remain their owners' trademarks; keep the MIT notice with the bundled files.\n\nRender them as monochrome template images so they tint with the menu bar and menu. A provider without a mark falls back to a letter tile: a rounded 14 pt square with the provider's initial. All four current providers have marks.\n\n## Implementation planning at handoff\n\nThese were left for implementation planning at handoff. The user's later discretion instruction supersedes the request for another approval round; current decisions are in the plan:\n\n- **UI framework:** AppKit or SwiftUI. SwiftUI is allowed if the app stays minimal.\n- **Budgets:** numerical CPU, memory, wake-up and polling budgets. Updates are adaptive in the background, plus a refresh when the dropdown opens.\n- **Icon loading:** how to bundle and load the marks. It must suit the SwiftPM and `build.sh` build (no asset catalogue) and macOS 13.\n- **Contrast:** check `systemOrange` text in a light menu bar and with Increase Contrast.\n\nThe assistant chose these details in the final mockup without a separate review. Keep them unless the user says otherwise:\n\n- the grey stale clock (orange is reserved for warnings);\n- the font sizes, spacing, menu width and dimming opacities above;\n- the dashed track pattern.\n\nThe keyboard shortcuts match the current app (`Sources/Yacht/AppDelegate.swift`).\n\n## Working tree\n\n- The branch is `redesign/native-dashboard`. That name comes from a rejected attempt; it is not a design mandate.\n- Earlier uncommitted work, including the Grok provider and its tests, must be preserved. Do not commit, push or discard anything without the user's approval.\n- The rejected redesign's recovery copy (see [the plan](plan.md#cleanup-baseline-before-native-implementation)) is not a source for this build.\n- Baseline checks: `swift build`, `swift run UsageCoreTests` (405 passing at cleanup) and `./build.sh`.\n- Record implementation decisions in [the plan](plan.md), then rebuild and check the wiki with `node docs/wiki/_build.mjs` and `node docs/wiki/_build.mjs --check`.\n\n## Starter prompt for the next session\n\n> Read `docs/wiki/design-handoff.md`, `docs/wiki/plan.md`, and `docs/wiki/native-implementation.md`. Use `../jstack` plan, wiki and rule-lean. Continue the native AppKit implementation, respecting the accepted behavior and the user's delegated discretion on native details. Reuse existing models, adapters and threshold logic where they fit. Preserve existing uncommitted work, including Grok support; do not commit or install over another copy without instruction.\n","toc":[{"id":"scope","title":"Scope","depth":2},{"id":"menu-bar","title":"Menu bar","depth":2},{"id":"dropdown","title":"Dropdown","depth":2},{"id":"states-and-colours","title":"States and colours","depth":2},{"id":"settings-window","title":"Settings window","depth":2},{"id":"add-account-sheet","title":"Add Account sheet","depth":2},{"id":"defaults","title":"Defaults","depth":2},{"id":"provider-marks","title":"Provider marks","depth":2},{"id":"implementation-planning-at-handoff","title":"Implementation planning at handoff","depth":2},{"id":"working-tree","title":"Working tree","depth":2},{"id":"starter-prompt-for-the-next-session","title":"Starter prompt for the next session","depth":2}],"titleAnchor":"design-handoff","links":["plan","plan","native-implementation","journal/2026-10-20-grill-38baa3c1-ee26-4927-a545-81600f42bc14","journal/2026-10-20-grill-21c6d8e7-5273-49e5-9839-1436d77ca537","plan","plan","plan","plan"],"attachments":[],"html":"\u003cp>Start here to implement the accepted design. This page is the build specification. \u003ca href=\"#/plan\">The plan\u003c/a> remains the authority for decisions, their reasons and their history. Where the two differ, the plan wins; report the difference rather than guessing.\u003c/p>\n\u003cp>Implementation update: the user subsequently delegated discretion while requiring a native app. The \u003ca href=\"#/plan~implementation-decisions\">plan\u003c/a> records the AppKit and resource choices; \u003ca href=\"#/native-implementation\">native implementation\u003c/a> records validation. Sizes and browser styling here are visual guidance, not pixel-exact native requirements.\u003c/p>\n\u003cp>The final mockups are on the \u003cstrong>Final\u003c/strong> page of the design canvas: \u003ca href=\"https://claude.ai/artifact/E9ZV6c1fjk6HKqyCJ9pMSM\" rel=\"noreferrer\">https://claude.ai/artifact/E9ZV6c1fjk6HKqyCJ9pMSM\u003c/a>. The canvas is private to the owner's account. If you cannot open it, ask the user to share it; this page is written so the build does not depend on it. All accounts, percentages and times on the canvas are fictional fixture data.\u003c/p>\n\u003ch2 id=\"scope\">Scope\u003c/h2>\n\u003cp>Build exactly four surfaces: the menu bar status item, its dropdown, the Settings window, and the Add Account sheet. There is no dashboard, account-detail window, notification, or onboarding flow. The dropdown's only actions are Refresh, Settings… and Quit Yacht.\u003c/p>\n\u003cp>The existing code is a factual reference, not a layout to keep. Apply \u003ccode>../jstack\u003c/code> \u003ccode>rule-lean\u003c/code>. Reuse the account model, provider adapters, threshold logic and folder registration where they fit, rather than rebuilding them.\u003c/p>\n\u003ch2 id=\"menu-bar\">Menu bar\u003c/h2>\n\u003cp>One status item shows one entry per account, in the user's order. Accounts whose menu bar window is set to Off are left out. Each entry shows the window the user chose for that account.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Setting\u003c/th>\n\u003cth>Entry layout\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Show accounts as: \u003cstrong>Labels\u003c/strong> (default)\u003c/td>\n\u003ctd>Two lines, centred: label at about 9 pt regular, over the percentage at about 11 pt semibold\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Show accounts as: \u003cstrong>Icons\u003c/strong>\u003c/td>\n\u003ctd>Provider mark (14 pt monochrome template image), then the percentage at 13 pt\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cul>\n\u003cli>Entries are about 10 pt apart.\u003c/li>\n\u003cli>Never mix icons and labels within the bar, and never combine the two layouts.\u003c/li>\n\u003cli>The percentage follows the Percentages setting: used (default) or remaining.\u003c/li>\n\u003cli>Threshold colour applies to the percentage only. In Icons mode the mark stays monochrome.\u003c/li>\n\u003cli>When the item is too wide for the space beside the notch, macOS hides it. The remedy is setting some accounts' menu bar window to Off. No automatic truncation has been requested.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"dropdown\">Dropdown\u003c/h2>\n\u003cp>This is layout C, with no section headers, grouping or expansion. Accounts appear in the user's order. Each block is:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Header:\u003c/strong> the provider mark (Icons mode only), then the label at 13 pt semibold. On the right, a stale reading shows a clock glyph in secondary colour, without elapsed-time text (revised during native build review).\u003c/li>\n\u003cli>\u003cstrong>One row per window the provider reports,\u003c/strong> in the adapter's order (5h before Weekly). Do not invent missing windows. Columns:\u003cul>\n\u003cli>window name in secondary text, about 12 pt;\u003c/li>\n\u003cli>a meter about 4 pt high with rounded ends, filled to the displayed percentage;\u003c/li>\n\u003cli>the percentage, right-aligned, with no \"left\" or \"used\" suffix;\u003c/li>\n\u003cli>the reset value, right-aligned, in secondary text.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ol>\n\u003cp>Reset values are either a countdown (\u003ccode>2h 14m\u003c/code>, \u003ccode>3d 4h\u003c/code>, \u003ccode>22h 0m\u003c/code>) or an exact time (\u003ccode>11:55\u003c/code> today, \u003ccode>Fri 13:40\u003c/code> on another day), chosen by the Reset times setting. The two are never combined.\u003c/p>\n\u003cp>If there is no reading, show one unlabelled placeholder row with a muted dashed meter and a dash in the percentage column. This gives expired credentials and awaiting-refresh states the same visual structure without claiming a quota window or reset time that has not been reported.\u003c/p>\n\u003cp>Muted native separators divide the account groups. After the accounts come a separator and \u003cstrong>Refresh\u003c/strong> (⌘R), \u003cstrong>Settings…\u003c/strong> (⌘,) and \u003cstrong>Quit Yacht\u003c/strong> (⌘Q). The mockup's menu is about 300 pt wide.\u003c/p>\n\u003ch2 id=\"states-and-colours\">States and colours\u003c/h2>\n\u003cp>The thresholds apply to usage \u003cstrong>used\u003c/strong>, whichever convention is displayed. The warning threshold is the Settings value (default 75%). Critical is derived as \u003ccode>warn + (100 − warn) / 2\u003c/code>, so 87.5% by default. This matches \u003ccode>AppSettings.criticalThreshold\u003c/code> in \u003ccode>Sources/UsageCore/Model.swift\u003c/code> and \u003ccode>tone\u003c/code>/\u003ccode>barTone\u003c/code> in \u003ccode>Sources/UsageCore/ViewModel.swift\u003c/code>.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>State\u003c/th>\n\u003cth>Trigger\u003c/th>\n\u003cth>Menu bar entry\u003c/th>\n\u003cth>Dropdown\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Normal\u003c/td>\n\u003ctd>Below the warning threshold\u003c/td>\n\u003ctd>Default text colour\u003c/td>\n\u003ctd>Neutral meter (\u003ccode>labelColor\u003c/code>) and default text\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Warning\u003c/td>\n\u003ctd>At or above the warning threshold\u003c/td>\n\u003ctd>Percentage in \u003ccode>systemOrange\u003c/code>\u003c/td>\n\u003ctd>Meter and percentage in \u003ccode>systemOrange\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Critical\u003c/td>\n\u003ctd>At or above the critical threshold\u003c/td>\n\u003ctd>Percentage in \u003ccode>systemRed\u003c/code>\u003c/td>\n\u003ctd>Meter and percentage in \u003ccode>systemRed\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Stale\u003c/td>\n\u003ctd>Refresh failed; previous reading kept\u003c/td>\n\u003ctd>Dimmed (about 40% opacity)\u003c/td>\n\u003ctd>Clock glyph in the header; rows dimmed (about 50%)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Stale + threshold\u003c/td>\n\u003ctd>Stale and at or above warning\u003c/td>\n\u003ctd>Colour wins; not dimmed\u003c/td>\n\u003ctd>Coloured rows are not dimmed; the clock still shows\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Reset passed\u003c/td>\n\u003ctd>The cached reset time has passed and no new data has arrived\u003c/td>\n\u003ctd>Muted \u003ccode>—\u003c/code> replaces the percentage\u003c/td>\n\u003ctd>Muted \u003ccode>—\u003c/code> in the percentage column; dashed meter track; no reset value\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>No data\u003c/td>\n\u003ctd>No reading, including expired credentials without a saved reading\u003c/td>\n\u003ctd>Muted \u003ccode>—\u003c/code>\u003c/td>\n\u003ctd>Unlabelled placeholder row with the same dashed meter and muted \u003ccode>—\u003c/code>; no reset value\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Use the SF Symbol \u003ccode>clock\u003c/code> for the stale marker. Use system colours, not fixed hex values, so light mode, dark mode and Increase Contrast adapt automatically. The canvas approximates them.\u003c/p>\n\u003ch2 id=\"settings-window\">Settings window\u003c/h2>\n\u003cp>Use one window with three grouped sections:\u003c/p>\n\u003cul>\n\u003cli>\u003cp>\u003cstrong>Accounts:\u003c/strong> a compact, single-line reorderable table (layout A, selected in the \u003ca href=\"#/journal/2026-10-20-grill-38baa3c1-ee26-4927-a545-81600f42bc14\">table review\u003c/a> and \u003ca href=\"#/journal/2026-10-20-grill-21c6d8e7-5273-49e5-9839-1436d77ca537\">approved after refinement\u003c/a>). This is implemented in AppKit and supersedes the earlier two-line rows. Dragging sets the order of both the dropdown and the menu bar. Each row has:\u003c/p>\n\u003cul>\n\u003cli>a drag handle and the provider mark;\u003c/li>\n\u003cli>an editable label that looks like plain text when idle. On first click, its editor starts at a small minimum width and grows with the text, capped at the available Account column;\u003c/li>\n\u003cli>the provider name;\u003c/li>\n\u003cli>a \u003cstrong>Menu bar\u003c/strong> pop-up listing the windows that provider reports, plus \u003cstrong>Off\u003c/strong>.\u003c/li>\n\u003c/ul>\n\u003cp>Show the selected account's folder in the bottom bar. \u003ccode>+\u003c/code> opens the Add Account sheet and \u003ccode>−\u003c/code> removes the selected account. The selected Claude account's Install/Replace Tap action also appears here when needed. Use a rounded group, uniform row backgrounds, and an integrated footer, guided by macOS Input Monitoring and Developer Tools. The user’s final instruction prioritizes Apple’s native guidelines over matching screenshot details: use standard AppKit table headers, separators, selection, resizable columns, and system colors. See \u003ca href=\"#/plan~accounts-table-refinement\">Accounts table refinement\u003c/a>.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Display:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Show accounts as:\u003c/strong> Icons / \u003cstrong>Labels\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Percentages:\u003c/strong> Remaining / \u003cstrong>Used\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Reset times:\u003c/strong> \u003cstrong>Countdown\u003c/strong> / Exact time.\u003c/li>\n\u003cli>\u003cstrong>Warning threshold:\u003c/strong> a slider from 50 to 95, default 75. Its caption reads \"orange at 75%, red at 87% used\". With remaining selected, it reads in that convention (for example, \"orange at 25% left\").\u003c/li>\n\u003cli>\u003cstrong>Menu bar preview\u003c/strong> showing the current figures.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>General:\u003c/strong> Launch at login.\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003cp>The existing \u003ccode>Sources/Yacht/SettingsWindowController.swift\u003c/code> already has the threshold slider, its caption, the folder picker, and Launch at login.\u003c/p>\n\u003ch2 id=\"add-account-sheet\">Add Account sheet\u003c/h2>\n\u003cp>This is the accepted local-profile flow. The fields are:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Provider:\u003c/strong> pop-up.\u003c/li>\n\u003cli>\u003cstrong>Folder:\u003c/strong> field plus \u003cstrong>Choose…\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Label:\u003c/strong> field.\u003c/li>\n\u003c/ul>\n\u003cp>Under the fields is one line of help: choose the folder the provider's own CLI already signs in to; Yacht only reads it; each account of the same provider uses its own folder.\u003c/p>\n\u003cp>A \u003cstrong>Found on this Mac\u003c/strong> list offers discovered folders. Each shows \u003cstrong>Use\u003c/strong>, or \"Added as \" if it is already registered. The buttons are \u003cstrong>Cancel\u003c/strong> and \u003cstrong>Add Account\u003c/strong> (default).\u003c/p>\n\u003cp>Claude accounts then offer Install Tap, as the current app does. Selecting a folder does not create or authenticate an account. See \u003ca href=\"#/plan~account-setup\">Account setup\u003c/a>.\u003c/p>\n\u003ch2 id=\"defaults\">Defaults\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Setting\u003c/th>\n\u003cth>Default\u003c/th>\n\u003cth>Status\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Show accounts as\u003c/td>\n\u003ctd>Labels\u003c/td>\n\u003ctd>Accepted (round 4)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Percentages\u003c/td>\n\u003ctd>Used\u003c/td>\n\u003ctd>Accepted (round 4)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Reset times\u003c/td>\n\u003ctd>Countdown\u003c/td>\n\u003ctd>Accepted (round 4)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Warning threshold\u003c/td>\n\u003ctd>75% used\u003c/td>\n\u003ctd>Accepted (round 5; existing value)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Menu bar window per account\u003c/td>\n\u003ctd>The adapter's declared primary: 5h for Claude and Kimi, weekly for Codex and Grok\u003c/td>\n\u003ctd>Existing behaviour; not separately reviewed\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Launch at login\u003c/td>\n\u003ctd>Existing behaviour\u003c/td>\n\u003ctd>Not separately reviewed\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"provider-marks\">Provider marks\u003c/h2>\n\u003cp>Use \u003ca href=\"https://github.com/lobehub/lobe-icons\" rel=\"noreferrer\">Lobe Icons\u003c/a> (MIT), package \u003ccode>@lobehub/icons-static-svg\u003c/code> 1.95.1. The files are \u003ccode>icons/claude.svg\u003c/code>, \u003ccode>icons/codex.svg\u003c/code>, \u003ccode>icons/grok.svg\u003c/code> and \u003ccode>icons/kimi.svg\u003c/code>, for example \u003ca href=\"https://cdn.jsdelivr.net/npm/@lobehub/icons-static-svg@1.95.1/icons/claude.svg\" rel=\"noreferrer\">https://cdn.jsdelivr.net/npm/@lobehub/icons-static-svg@1.95.1/icons/claude.svg\u003c/a>. Each is a single-colour 24×24 path. The logos remain their owners' trademarks; keep the MIT notice with the bundled files.\u003c/p>\n\u003cp>Render them as monochrome template images so they tint with the menu bar and menu. A provider without a mark falls back to a letter tile: a rounded 14 pt square with the provider's initial. All four current providers have marks.\u003c/p>\n\u003ch2 id=\"implementation-planning-at-handoff\">Implementation planning at handoff\u003c/h2>\n\u003cp>These were left for implementation planning at handoff. The user's later discretion instruction supersedes the request for another approval round; current decisions are in the plan:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>UI framework:\u003c/strong> AppKit or SwiftUI. SwiftUI is allowed if the app stays minimal.\u003c/li>\n\u003cli>\u003cstrong>Budgets:\u003c/strong> numerical CPU, memory, wake-up and polling budgets. Updates are adaptive in the background, plus a refresh when the dropdown opens.\u003c/li>\n\u003cli>\u003cstrong>Icon loading:\u003c/strong> how to bundle and load the marks. It must suit the SwiftPM and \u003ccode>build.sh\u003c/code> build (no asset catalogue) and macOS 13.\u003c/li>\n\u003cli>\u003cstrong>Contrast:\u003c/strong> check \u003ccode>systemOrange\u003c/code> text in a light menu bar and with Increase Contrast.\u003c/li>\n\u003c/ul>\n\u003cp>The assistant chose these details in the final mockup without a separate review. Keep them unless the user says otherwise:\u003c/p>\n\u003cul>\n\u003cli>the grey stale clock (orange is reserved for warnings);\u003c/li>\n\u003cli>the font sizes, spacing, menu width and dimming opacities above;\u003c/li>\n\u003cli>the dashed track pattern.\u003c/li>\n\u003c/ul>\n\u003cp>The keyboard shortcuts match the current app (\u003ccode>Sources/Yacht/AppDelegate.swift\u003c/code>).\u003c/p>\n\u003ch2 id=\"working-tree\">Working tree\u003c/h2>\n\u003cul>\n\u003cli>The branch is \u003ccode>redesign/native-dashboard\u003c/code>. That name comes from a rejected attempt; it is not a design mandate.\u003c/li>\n\u003cli>Earlier uncommitted work, including the Grok provider and its tests, must be preserved. Do not commit, push or discard anything without the user's approval.\u003c/li>\n\u003cli>The rejected redesign's recovery copy (see \u003ca href=\"#/plan~cleanup-baseline-before-native-implementation\">the plan\u003c/a>) is not a source for this build.\u003c/li>\n\u003cli>Baseline checks: \u003ccode>swift build\u003c/code>, \u003ccode>swift run UsageCoreTests\u003c/code> (405 passing at cleanup) and \u003ccode>./build.sh\u003c/code>.\u003c/li>\n\u003cli>Record implementation decisions in \u003ca href=\"#/plan\">the plan\u003c/a>, then rebuild and check the wiki with \u003ccode>node docs/wiki/_build.mjs\u003c/code> and \u003ccode>node docs/wiki/_build.mjs --check\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"starter-prompt-for-the-next-session\">Starter prompt for the next session\u003c/h2>\n\u003cblockquote>\n\u003cp>Read \u003ccode>docs/wiki/design-handoff.md\u003c/code>, \u003ccode>docs/wiki/plan.md\u003c/code>, and \u003ccode>docs/wiki/native-implementation.md\u003c/code>. Use \u003ccode>../jstack\u003c/code> plan, wiki and rule-lean. Continue the native AppKit implementation, respecting the accepted behavior and the user's delegated discretion on native details. Reuse existing models, adapters and threshold logic where they fit. Preserve existing uncommitted work, including Grok support; do not commit or install over another copy without instruction.\u003c/p>\n\u003c/blockquote>\n","backlinks":["index","plan","mockup-handoff","native-implementation"]},{"id":"mockup-handoff","title":"Mockup handoff","section":"Overview","order":3,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-20\u003c/span>","updated":"2026-10-20","summary":"","source":"---\ntitle: Mockup handoff\nupdated: 2026-10-20\norder: 3\n---\n\n# Mockup handoff\n\n> **Completed.** The mockup work this page started is done. To implement the final design, start from the [design handoff](design-handoff.md). This page is kept as history.\n\nStart here when continuing the design in another session. The user wants mockups for a lightweight, minimal macOS menu bar AI usage tracker, implemented eventually in native Swift. The previous dashboard redesign was rejected because it was built before the requirements discussion.\n\n## Read first\n\n- [Accepted requirements, open decisions, and working tree facts](plan.md) — authoritative interpretation of the interview.\n- [Round 1 answers](journal/2026-10-19-grill-8ef2fa34-9d14-4577-827c-f7a1b51f04f7.md) — purpose, scope, and constraints.\n- [Round 2 answers](journal/2026-10-19-grill-b89a23b6-c6c3-4fbb-934f-22325c1fb909.md) — everyday reading and display behavior.\n- [Round 3 answers](journal/2026-10-20-grill-6f40375f-6228-48e1-972d-055c180fcfbe.md) — entry customization, account scope, reset modes, and the setup advice request.\n\nAll three rounds are collected and interpreted in the plan. There is enough direction to start rough alternatives without another interview round. The user asked for the leanest account setup; the researched recommendation in the plan is still a proposal to review through the mockups.\n\n## Design task\n\nExplore rough visual alternatives before selecting a direction. A plain native menu and a compact native table are useful candidates for comparison, not accepted designs. Keep the scope to a dropdown and settings, and represent the four-to-eight-account workload rather than only a single ideal account.\n\nSuggested review material:\n\n- A closed menu bar with multiple enabled account figures, including a crowded example.\n- The dropdown with four accounts and with eight accounts, preserving the same user-controlled flat order and showing each account's reported windows.\n- Settings for the accepted customization choices: per-entry labels and optional provider icons, one chosen menu bar quota window per account, used/remaining convention, and countdown/exact reset mode. Placement, defaults, and the scope of display settings remain proposals.\n- A compact account-setup sketch using the proposed local-profile registration flow, with two accounts from the same provider. Label this flow as recommended, not already approved.\n- Normal, stale, reset-passed/awaiting-update, and no-data examples. Label fictional fixture data clearly.\n- A short explanation of the readability and density tradeoffs between alternatives.\n\nThese are proposed design exercises, not additional product requirements. Do not hide reported windows behind account expansion to make a mockup smaller. Do not combine independent account quotas into a single percentage.\n\nKeep actions within the accepted monitoring scope: refresh and settings. The user explicitly requested simplicity and no invented features. “Full customization” establishes the requested entry label/icon controls; it is not a request for an unrestricted theme or extension system.\n\nUse mockups to settle structure and placement. Visual choices, presentation defaults, truncation/overflow behavior, and light/dark treatments are still proposals until reviewed. Minimal appearance alone does not establish low resource use.\n\n## Scope and continuity\n\nThis handoff requests design exploration. It does not authorize building the replacement app. No final layout, AppKit-versus-SwiftUI decision, numerical resource budget, or authentication redesign has been accepted.\n\nThe repository is on `redesign/native-dashboard`, but that branch name reflects the rejected attempt. Its redesign files have been removed. Earlier uncommitted Grok work remains and must be preserved. See the plan for cleanup evidence and the recovery-copy location.\n\nUse `../jstack` for wiki, plan, grill-form, and `rule-lean`. Ask only consequential questions still open after reading the plan; do not repeat settled interview rounds. Record reviewed design decisions in the plan and rebuild/check the wiki. Existing code and historical `.plan/maps` are factual references, not a mandate to retain their UI.\n\n## Starter prompt for the next session\n\n> Read `docs/wiki/mockup-handoff.md` and `docs/wiki/plan.md`. Use `../jstack` wiki, plan, grill-form, and rule-lean. Help me explore rough alternatives for the lightweight native Swift menu bar tracker before choosing a design. Respect the accepted requirements, add no invented features, and distinguish proposals from decisions. Include the local-profile account setup recommendation for review. Preserve the existing working tree. Start with mockups; do not implement the replacement app yet.\n","toc":[{"id":"read-first","title":"Read first","depth":2},{"id":"design-task","title":"Design task","depth":2},{"id":"scope-and-continuity","title":"Scope and continuity","depth":2},{"id":"starter-prompt-for-the-next-session","title":"Starter prompt for the next session","depth":2}],"titleAnchor":"mockup-handoff","links":["design-ha on. A plain native menu and a compact native table are useful candidates for comparison, not accepted designs. Keep the scope to a dropdown and settings, and represent the four-to-eight-account workload rather than only a single ideal account.\u003c/p>\n\u003cp>Suggested review material:\u003c/p>\n\u003cul>\n\u003cli>A closed menu bar with multiple enabled account figures, including a crowded example.\u003c/li>\n\u003cli>The dropdown with four accounts and with eight accounts, preserving the same user-controlled flat order and showing each account's reported windows.\u003c/li>\n\u003cli>Settings for the accepted customization choices: per-entry labels and optional provider icons, one chosen menu bar quota window per account, used/remaining convention, and countdown/exact reset mode. Placement, defaults, and the scope of display settings remain proposals.\u003c/li>\n\u003cli>A compact account-setup sketch using the proposed local-profile registration flow, with two accounts from the same provider. Label this flow as recommended, not already approved.\u003c/li>\n\u003cli>Normal, stale, reset-passed/awaiting-update, and no-data examples. Label fictional fixture data clearly.\u003c/li>\n\u003cli>A short explanation of the readability and density tradeoffs between alternatives.\u003c/li>\n\u003c/ul>\n\u003cp>These are proposed design exercises, not additional product requirements. Do not hide reported windows behind account expansion to make a mockup smaller. Do not combine independent account quotas into a single percentage.\u003c/p>\n\u003cp>Keep actions within the accepted monitoring scope: refresh and settings. The user explicitly requested simplicity and no invented features. “Full customization” establishes the requested entry label/icon controls; it is not a request for an unrestricted theme or extension system.\u003c/p>\n\u003cp>Use mockups to settle structure and placement. Visual choices, presentation defaults, truncation/overflow behavior, and light/dark treatments are still proposals until reviewed. Minimal appearance alone does not establish low resource use.\u003c/p>\n\u003ch2 id=\"scope-and-continuity\">Scope and continuity\u003c/h2>\n\u003cp>This handoff requests design exploration. It does not authorize building the replacement app. No final layout, AppKit-versus-SwiftUI decision, numerical resource budget, or authentication redesign has been accepted.\u003c/p>\n\u003cp>The repository is on \u003ccode>redesign/native-dashboard\u003c/code>, but that branch name reflects the rejected attempt. Its redesign files have been removed. Earlier uncommitted Grok work remains and must be preserved. See the plan for cleanup evidence and the recovery-copy location.\u003c/p>\n\u003cp>Use \u003ccode>../jstack\u003c/code> for wiki, plan, grill-form, and \u003ccode>rule-lean\u003c/code>. Ask only consequential questions still open after reading the plan; do not repeat settled interview rounds. Record reviewed design decisions in the plan and rebuild/check the wiki. Existing code and historical \u003ccode>.plan/maps\u003c/code> are factual references, not a mandate to retain their UI.\u003c/p>\n\u003ch2 id=\"starter-prompt-for-the-next-session\">Starter prompt for the next session\u003c/h2>\n\u003cblockquote>\n\u003cp>Read \u003ccode>docs/wiki/mockup-handoff.md\u003c/code> and \u003ccode>docs/wiki/plan.md\u003c/code>. Use \u003ccode>../jstack\u003c/code> wiki, plan, grill-form, and rule-lean. Help me explore rough alternatives for the lightweight native Swift menu bar tracker before choosing a design. Respect the accepted requirements, add no invented features, and distinguish proposals from decisions. Include the local-profile account setup recommendation for review. Preserve the existing working tree. Start with mockups; do not implement the replacement app yet.\u003c/p>\n\u003c/blockquote>\n","backlinks":["index","plan"]},{"id":"native-implementation","title":"Native implementation","section":"Overview","order":3,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-21\u003c/span>","updated":"2026-10-21","summary":"","source":"---\ntitle: Native implementation\nupdated: 2026-10-21\norder: 3\n---\n\n# Native implementation\n\nThe [accepted design](design-handoff.md) is implemented in Swift/AppKit on the existing `redesign/native-dashboard` branch. The user delegated discretion while requiring native behavior. All eight boards on the [Final canvas page](https://claude.ai/artifact/E9ZV6c1fjk6HKqyCJ9pMSM#page-9539465e2f90) were inspected before implementation.\n\n## What changed\n\n- Native status button content supports labels over percentages or monochrome Lobe provider marks beside percentages. Build review moved the two-line style's figure down one point for a little more separation.\n- A system NSMenu contains compact account views, muted separators between accounts, and standard Refresh, Settings, and Quit actions. It retains native keyboard handling and menu scrolling.\n- Settings uses NSTableView with compact single-line rows in a rounded group, uniform system colors, standard headers and separators, resizable columns, and an integrated +/− footer. The footer shows the selected folder and the existing Install/Replace Tap action for Claude when needed. Folder identity remains stable for editing, reordering, and removal. Labels look plain when idle, edit on the first click, and grow with their contents up to the column boundary. One quota window or Off is chosen per account. Off only affects the menu bar.\n- Native segmented controls select Icons/Labels, Used/Remaining, and Countdown/Exact time. The warning slider keeps the existing derived critical threshold.\n- The Add Account sheet validates the folder and label, rejects duplicate folder registration, and offers discovered folders for all four providers. Codex discovery includes `~/.codex` and `.codex*` sibling directories; Kimi discovery includes `~/.kimi-code` and `.kimi-code*` siblings, then legacy `.kimi*` folders containing `credentials/kimi-code.json`. Discovery checks file presence without reading credentials. Selecting a folder does not authenticate an account.\n- Passed reset times and missing readings share a muted dash and dashed meter. Missing readings use one unlabelled placeholder row; the model still reports no fabricated quota windows. Stale readings show a clock without elapsed-time text and retain the hover explanation; threshold colors win over dimming.\n- Four small PDF vector marks are bundled with the MIT notice. Runtime needs no third-party UI framework, SVG parser, web view, or icon downloads.\n\nThe existing provider adapters, credential boundaries, caches, and launch-at-login mechanism remain. Old configuration fields and the core template-rendering API are retained for compatibility; the native UI uses the structured presentation in `UsagePresentation.swift`.\n\nFor immediate label editing, `AccountsTableView` approves editable descendant text fields in AppKit's [first-responder validation hook](https://developer.apple.com/documentation/appkit/nsresponder/validateproposedfirstresponder%28_%3Afor%3A%29). Other controls keep the standard table behavior.\n\nThe table follows Apple’s [Lists and tables](https://developer.apple.com/design/human-interface-guidelines/lists-and-tables) guidance for descriptive headings and column resizing. The single-pane window follows [Settings](https://developer.apple.com/design/human-interface-guidelines/settings) guidance for its title and disabled minimize/maximize actions. These guide the implementation without requiring a replica of System Settings.\n\n## Validation\n\nThe newer [0.2.0 release preflight](verification/runs/2026-10-21-v0.2.0-preflight.md) records the versioned universal bundle, packaged-app smoke check, and current live-provider limits. Earlier checks below retain their original scope.\n\nCommands:\n\n```sh\nswift build\nswift run UsageCoreTests\n./build.sh\nnode docs/wiki/_build.mjs\nnode docs/wiki/_build.mjs --check\n```\n\nThe core suite currently reports **448 passed, zero failed**: the original 405 checks, 38 checks for native presentation and persistence, and five Codex/Kimi discovery regression checks. Coverage includes remaining/used semantics, warning precedence, reset boundaries, unknown values, selected/missing windows, Off, same-provider registration, duplicate rejection, reorder identity, rename preservation, and old-config decoding. Discovery checks cover default and sibling profiles, file exclusion, provider isolation, credential-bearing legacy Kimi profiles, unrelated Kimi folders, and an unreadable home.\n\nThe release bundle is `build/Yacht.app`, built and ad-hoc signed by `build.sh`. It has not replaced an installed copy. [Version 0.2.0 is published and its downloaded assets verified](verification/runs/2026-10-21-v0.2.0-publication.md).\n\nComputer-use checks on the offline native demo:\n\n- Settings and Add Account sheet rendered with system controls.\n- Eight-account dropdown rendered normal, warning, critical, stale, past-reset, and missing-data fixtures.\n- Icons/Labels, Remaining/Used, and Exact/Countdown controls changed their corresponding presentation.\n- Off removed the selected status figure while retaining its account and windows in the dropdown.\n- Refresh returned to the native window normally.\n- Adding an additional local folder for the same provider completed and appeared in the account list.\n- Editing a label and tabbing away updated the preview while preserving the account's folder identity.\n- High-contrast light rendering kept the labels, meters, provider marks, and warning states legible.\n\nFolder discovery, live authentication failures, tap installation, actual login registration, and live provider network behavior were not exercised in the demo. The provider regression tests passed. Full VoiceOver operation and manual drag gestures still need a real-user check; reorder identity is covered by core tests. Do not interpret offline UI validation as a live-provider performance guarantee.\n\nOn 2026-10-21, the refined Accounts table was checked in a separately identified offline demo bundle in dark and light appearances. First-click editing, short-to-long editor growth, committing and trimming a rename, updating its accessibility label, restoring an empty label, selected-folder updates, Off, removing a demo account, opening Add Account, and cancelling while preserving selection were verified. Automated drag attempts did not change the order, so native drag/drop remains unverified; the existing core reorder tests still pass. The simplification uses semantic system colors and removes hover-specific handle behavior. Following the user’s final direction, custom header and separator drawing were also removed in favor of standard AppKit rendering; column resizing and system scrollbar preferences are respected, and the Settings window does not minimize.\n\nA follow-up alignment fix replaces hard-coded vertical frames and the label’s fixed height with center constraints and AppKit intrinsic control sizes. Idle and editing rows were visually checked in the offline demo.\n\nSettings now fits its stack's measured height with a 20 pt bottom margin and resizes after account changes. Header titles use an 8 pt paragraph inset within the standard header cells. A narrow clip removes the final header divider, and a native header view fills the corner above the scrollbar. Header typography, colors, column resizing, and system scrollbar preferences remain AppKit-controlled. The release build passed; the eight-account demo and four-account normal window were visually checked, and the saved configuration hash was unchanged across the final restart.\n\nAppKit's `.gap` drag feedback was tried and then removed after the user reported that it felt bad. Reordering uses the default insertion indicator again. The existing drop handler remains the only place that changes account order, so hovering or cancelling a drag does not save a new order. The alignment fix is retained.\n\nThe demo was stopped and the current repository release restarted in normal mode. Its Settings window was visually verified with the four saved accounts intact. The saved configuration's SHA-256 was unchanged through the demo checks; no real account registrations were edited.\n\nA subsequent normal-mode setup check confirmed that Codex discovery lists `~/.codex` and marks an existing registration as “Added as codex.” Existing accounts were preserved during the rebuild.\n\nKimi discovery was subsequently wired into the same sheet and verified with filesystem fixtures for current and legacy profiles. Local metadata confirmed both `~/.kimi-code` and `~/.kimi` contain the credential file. The release rebuilt and restarted in normal mode, but the native UI tool reported no available window after relaunch, so the final Kimi sheet was not visually verified. Saved account registrations were not changed.\n\n## Safe local inspection\n\n```sh\nopen -n build/Yacht.app --args --demo\n```\n\nDemo mode uses fictional account fixtures entirely in memory, bypassing configuration loading/writing and provider startup. It disables tap installation and launch-at-login changes. The demo's Yacht menu includes **Usage Preview (Demo)** (⌘U), which opens the same native usage menu beside Settings even if the macOS menu bar is crowded.\n\nAdd `--light` or `--contrast` for per-app light/high-contrast-light inspection; these do not change the system preference. Normal launch uses the user's actual configuration and existing provider adapters.\n\n## Resource behavior\n\nThe UI uses one timer, scheduled for the next minute boundary or pending reset. Provider completions refresh immediately. This replaces the old five-second redraw; existing provider adaptive schedules remain unchanged.\n\nInitial profiling on macOS 27 found continuous AppKit status-item replicant snapshots when live text controls were attached to the status button: about 87% of one CPU core at idle. The status button now holds a cached image drawn with AppKit; it is regenerated when the presentation or effective appearance changes. The Settings preview shares the drawing code.\n\nThe same eight-account release demo with Settings open and high-contrast light appearance then recorded no CPU-time increase at `ps`'s 0.01-second resolution over 20 seconds. Its ending resident set was about 96 MiB. Evidence: [before](evidence/native-2026-10-20/idle-before.json) and [after](evidence/native-2026-10-20/idle-after.json). These short observations establish that the redraw loop stopped, not a zero-CPU or fixed-memory guarantee.\n\nA [65-second sample of the initial native release](evidence/native-2026-10-20/idle-final.json), in system dark appearance with Settings open, included a minute-boundary update. It consumed 0.08 CPU seconds, averaging **0.123% of one core**, with an ending resident set of about **110 MiB**. The evidence records the tested binary's SHA-256.\n\nResource measurements are reported for the offline release process only. Live provider requests and Codex child processes require separate measurement with representative signed-in profiles.\n\n## Working tree continuity\n\nBefore implementation, the working tree was copied to `/var/folders/00/h_k67s0j5dq0qvg6ylqysk2w0000gn/T/yacht-before-native-0youz3gy`. The earlier rejected redesign backup is separate and was not used as implementation source. Existing uncommitted Grok work is preserved.\n","toc":[{"id":"what-changed","title":"What changed","depth":2},{"id":"validation","title":"Validation","depth":2},{"id":"safe-local-inspection","title":"Safe local inspection","depth":2},{"id":"resource-behavior","title":"Resource behavior","depth":2},{"id":"working-tree-continuity","title":"Working tree continuity","depth":2}],"titleAnchor":"native-implementation","links":["design-handoff","verification/runs/2026-10-21-v0.2.0-preflight","verification/runs/2026-10-21-v0.2.0-publication"],"attachment  time. The warning slider keeps the existing derived critical threshold.\u003c/li>\n\u003cli>The Add Account sheet validates the folder and label, rejects duplicate folder registration, and offers discovered folders for all four providers. Codex discovery includes \u003ccode>~/.codex\u003c/code> and \u003ccode>.codex*\u003c/code> sibling directories; Kimi discovery includes \u003ccode>~/.kimi-code\u003c/code> and \u003ccode>.kimi-code*\u003c/code> siblings, then legacy \u003ccode>.kimi*\u003c/code> folders containing \u003ccode>credentials/kimi-code.json\u003c/code>. Discovery checks file presence without reading credentials. Selecting a folder does not authenticate an account.\u003c/li>\n\u003cli>Passed reset times and missing readings share a muted dash and dashed meter. Missing readings use one unlabelled placeholder row; the model still reports no fabricated quota windows. Stale readings show a clock without elapsed-time text and retain the hover explanation; threshold colors win over dimming.\u003c/li>\n\u003cli>Four small PDF vector marks are bundled with the MIT notice. Runtime needs no third-party UI framework, SVG parser, web view, or icon downloads.\u003c/li>\n\u003c/ul>\n\u003cp>The existing provider adapters, credential boundaries, caches, and launch-at-login mechanism remain. Old configuration fields and the core template-rendering API are retained for compatibility; the native UI uses the structured presentation in \u003ccode>UsagePresentation.swift\u003c/code>.\u003c/p>\n\u003cp>For immediate label editing, \u003ccode>AccountsTableView\u003c/code> approves editable descendant text fields in AppKit's \u003ca href=\"https://developer.apple.com/documentation/appkit/nsresponder/validateproposedfirstresponder%28_%3Afor%3A%29\" rel=\"noreferrer\">first-responder validation hook\u003c/a>. Other controls keep the standard table behavior.\u003c/p>\n\u003cp>The table follows Apple’s \u003ca href=\"https://developer.apple.com/design/human-interface-guidelines/lists-and-tables\" rel=\"noreferrer\">Lists and tables\u003c/a> guidance for descriptive headings and column resizing. The single-pane window follows \u003ca href=\"https://developer.apple.com/design/human-interface-guidelines/settings\" rel=\"noreferrer\">Settings\u003c/a> guidance for its title and disabled minimize/maximize actions. These guide the implementation without requiring a replica of System Settings.\u003c/p>\n\u003ch2 id=\"validation\">Validation\u003c/h2>\n\u003cp>The newer \u003ca href=\"#/verification/runs/2026-10-21-v0.2.0-preflight\">0.2.0 release preflight\u003c/a> records the versioned universal bundle, packaged-app smoke check, and current live-provider limits. Earlier checks below retain their original scope.\u003c/p>\n\u003cp>Commands:\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">swift build\nswift run UsageCoreTests\n./build.sh\nnode docs/wiki/_build.mjs\nnode docs/wiki/_build.mjs --check\n\u003c/code>\u003c/pre>\n\u003cp>The core suite currently reports \u003cstrong>448 passed, zero failed\u003c/strong>: the original 405 checks, 38 checks for native presentation and persistence, and five Codex/Kimi discovery regression checks. Coverage includes remaining/used semantics, warning precedence, reset boundaries, unknown values, selected/missing windows, Off, same-provider registration, duplicate rejection, reorder identity, rename preservation, and old-config decoding. Discovery checks cover default and sibling profiles, file exclusion, provider isolation, credential-bearing legacy Kimi profiles, unrelated Kimi folders, and an unreadable home.\u003c/p>\n\u003cp>The release bundle is \u003ccode>build/Yacht.app\u003c/code>, built and ad-hoc signed by \u003ccode>build.sh\u003c/code>. It has not replaced an installed copy. \u003ca href=\"#/verification/runs/2026-10-21-v0.2.0-publication\">Version 0.2.0 is published and its downloaded assets verified\u003c/a>.\u003c/p>\n\u003cp>Computer-use checks on the offline native demo:\u003c/p>\n\u003cul>
