u003ccode>0be23b8fc3b3e6a4f557afbd503ed8c693a7faf3d3f8955d4add1d23ba0d61d1\u003c/code>. The temporary mount was ejected. No installed application or account data was changed for these checks.\u003c/p>\n\u003ch2 id=\"limits\">Limits\u003c/h2>\n\u003cp>This run verifies publication and downloaded package structure. It did not launch the downloaded app, exercise Gatekeeper, or repeat UI/provider checks. The separate \u003ca href=\"#/verification/runs/2026-10-21-v0.2.0-preflight\">preflight\u003c/a> records local packaged-app UI checks and the still-untested fresh Kimi request. Ad-hoc signing without notarization remains the existing distribution policy.\u003c/p>\n","backlinks":["index","plan","native-implementation","features/release","verification/runs/2026-10-21-v0.2.0-preflight"]},{"id":"verification/setup","title":"Verification setup","section":"Verification","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-21\u003c/span>","updated":"2026-10-21","summary":"","source":"---\ntitle: Verification setup\nupdated: 2026-10-21\n---\n\n# Verification setup\n\nUse the repository's native Swift tools. Core tests are an executable: `swift run UsageCoreTests`. Tap tests use Bash and `jq`: `bash tap/test_tap.sh`. `./build.sh` builds arm64 and x86_64 separately and combines them with `lipo`, preserving Command Line Tools support.\n\nThe current verification host has macOS 27, Swift 6.3, Apple Silicon, Rosetta, `jq`, `create-dmg`, and Node 22. Intel execution under Rosetta is available; physical Intel and macOS 13 machines are not available in this session.\n\n## Instances and data\n\nNormal Yacht uses `~/Library/Application Support/Yacht/config.json`. Hash that file before isolated checks; never wipe or replace it. A normal run reads existing registered profiles and may refresh Yacht-owned usage caches. Tap installation and login-item changes are separate side effects and are not part of this preflight.\n\n`open -n build/Yacht.app --args --demo` starts fictional accounts entirely in memory. Demo disables provider requests, configuration writes, tap installation, and launch-at-login changes. Command-U opens Usage Preview. `--light` and `--contrast` change only the demo's appearance.\n\nWhen verifying an exact copy from the DMG, temporarily stop the normal repository instance by its exact executable path, then launch the copied app with `--demo`. This avoids two instances with the same bundle identifier. Record its binary hash and bundle version before using native computer controls. Restore the normal repository app afterward. Do not replace `/Applications/Yacht.app`.\n\n## Packaging\n\nThe CI recipe is `.github/workflows/release.yml`. For local headless verification, add `--skip-jenkins` to create-dmg so Finder styling is skipped. Mount with `hdiutil attach -readonly -nobrowse -noautoopen`, copy out `Yacht.app`, verify with `codesign`, and eject with `hdiutil detach`. This path was executed during the [0.2.0 preflight](runs/2026-10-21-v0.2.0-preflight.md).\n\nEvidence belongs under `evidence/\u003crun-id>/`. Save sanitized outcomes and fingerprints, never provider credentials or raw authenticated responses. Temporary fixtures and apps stay outside the repository. Only stop/remove resources created for the run.\n","toc":[{"id":"instances-and-data","title":"Instances and data","depth":2},{"id":"packaging","title":"Packaging","depth":2}],"titleAnchor":"verification-setup","links":["verification/runs/2026-10-21-v0.2.0-preflight"],"attachments":[],"html":"\u003cp>Use the repository's native Swift tools. Core tests are an executable: \u003ccode>swift run UsageCoreTests\u003c/code>. Tap tests use Bash and \u003ccode>jq\u003c/code>: \u003ccode>bash tap/test_tap.sh\u003c/code>. \u003ccode>./build.sh\u003c/code> builds arm64 and x86_64 separately and combines them with \u003ccode>lipo\u003c/code>, preserving Command Line Tools support.\u003c/p>\n\u003cp>The current verification host has macOS 27, Swift 6.3, Apple Silicon, Rosetta, \u003ccode>jq\u003c/code>, \u003ccode>create-dmg\u003c/code>, and Node 22. Intel execution under Rosetta is available; physical Intel and macOS 13 machines are not available in this session.\u003c/p>\n\u003ch2 id=\"instances-and-data\">Instances and data\u003c/h2>\n\u003cp>Normal Yacht uses \u003ccode>~/Library/Application Support/Yacht/config.json\u003c/code>. Hash that file before isolated checks; never wipe or replace it. A normal run reads existing registered profiles and may refresh Yacht-owned usage caches. Tap installation and login-item changes are separate side effects and are not part of this preflight.\u003c/p>\n\u003cp>\u003ccode>open -n build/Yacht.app --args --demo\u003c/code> starts fictional accounts entirely in memory. Demo disables provider requests, configuration writes, tap installation, and launch-at-login changes. Command-U opens Usage Preview. \u003ccode>--light\u003c/code> and \u003ccode>--contrast\u003c/code> change only the demo's appearance.\u003c/p>\n\u003cp>When verifying an exact copy from the DMG, temporarily stop the normal repository instance by its exact executable path, then launch the copied app with \u003ccode>--demo\u003c/code>. This avoids two instances with the same bundle identifier. Record its binary hash and bundle version before using native computer controls. Restore the normal repository app afterward. Do not replace \u003ccode>/Applications/Yacht.app\u003c/code>.\u003c/p>\n\u003ch2 id=\"packaging\">Packaging\u003c/h2>\n\u003cp>The CI recipe is \u003ccode>.github/workflows/release.yml\u003c/code>. For local headless verification, add \u003ccode>--skip-jenkins\u003c/code> to create-dmg so Finder styling is skipped. Mount with \u003ccode>hdiutil attach -readonly -nobrowse -noautoopen\u003c/code>, copy out \u003ccode>Yacht.app\u003c/code>, verify with \u003ccode>codesign\u003c/code>, and eject with \u003ccode>hdiutil detach\u003c/code>. This path was executed during the \u003ca href=\"#/verification/runs/2026-10-21-v0.2.0-preflight\">0.2.0 preflight\u003c/a>.\u003c/p>\n\u003cp>Evidence belongs under \u003ccode>evidence/&lt;run-id&gt;/\u003c/code>. Save sanitized outcomes and fingerprints, never provider credentials or raw authenticated responses. Temporary fixtures and apps stay outside the repository. Only stop/remove resources created for the run.\u003c/p>\n","backlinks":["features/release","features/index"]}],"sections":["Overview","Features","Journal","Verification"]}</script>
<script>(() => {
  'use strict';
  const {title:wikiTitle,pages,sections} = JSON.parse(document.getElementById('wiki-data').textContent);
  const byId = new Map(pages.map(p=>[p.id,p]));
  const $ = id => document.getElementById(id);
  const colorScheme = matchMedia('(prefers-color-scheme: dark)');
  const colorInputs = document.querySelectorAll('input[name="color"]');
  function setColor(preference) {
    if (!['automatic', 'light', 'dark'].includes(preference)) preference = 'automatic';
    document.documentElement.dataset.colorPreference = preference;
    document.documentElement.dataset.theme = preference === 'automatic' ? (colorScheme.matches ? 'dark' : 'light') : preference;
    colorInputs.forEach(input => { input.checked = input.value === preference; });
  }
  setColor(document.documentElement.dataset.colorPreference);
  colorInputs.forEach(input => input.addEventListener('change', () => {
    setColor(input.value);
    try { localStorage.setItem('planning-wiki-color', input.value); } catch {}
  }));
  colorScheme.addEventListener('change', () => setColor(document.documentElement.dataset.colorPreference));
  window.addEventListener('storage', event => {
    if (event.key === 'planning-wiki-color' || event.key === null) setColor(event.newValue);
  });
  document.addEventListener('click', event => {
    if (!$('appearance').contains(event.target)) $('appearance').open = false;
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && $('appearance').open) {
      $('appearance').open = false;
      $('appearance').querySelector('summary').focus();
    }
  });
  let current = null;
  const link = (label,href) => { const a=document.createElement('a'); a.textContent=label; a.href=href; return a; };
  const route = id => '#/'+id.split('/').map(s=>encodeURIComponent(s).replace(/~/g,'%7E')).join('/');
  for (const section of sections) {
    const group=document.createElement('div');group.className='nav-group';
    const label=document.createElement('div');label.className='nav-group-label';label.textContent=section;group.append(label);
    pages.filter(p=>p.section===section).forEach(p=>{const a=link(p.id==='index'?'Main page':p.title,route(p.id));a.dataset.page=p.id;group.append(a);});
    $('navigation').append(group);
  }
  if (matchMedia('(max-width: 700px)').matches) $('navigation-details').open=false;
  function mode(source) {
    $('article-view').hidden=source;
    $('source-view').hidden=!source;
    $('read-tab').classList.toggle('selected',!source);
    $('source-tab').classList.toggle('selected',source);
    $('read-tab').setAttribute('aria-pressed',String(!source));
    $('source-tab').setAttribute('aria-pressed',String(source));
    $('contents').hidden=source || !current?.toc.length;
  }
  function markText(text,query) {
    const fragment=document.createDocumentFragment();
    const lower=text.toLowerCase(), needle=query.toLowerCase();
    let start=0, at;
    while (needle && (at=lower.indexOf(needle,start))!==-1) {
      fragment.append(document.createTextNode(text.slice(start,at)));
      const mark=document.createElement('mark');mark.textContent=text.slice(at,at+query.length);fragment.append(mark);start=at+query.length;
    }
    fragment.append(document.createTextNode(text.slice(start)));return fragment;
  }
  function search(query) {
    current=null;
    $('search').value=query;
    $('page-title').textContent='Search results';
    $('page-meta').hidden=true;document.querySelector('.toolbar').hidden=true;
    $('article-view').hidden=true;$('source-view').hidden=true;$('search-results').hidden=false;$('toc').replaceChildren();
    $('contents').hidden=true;
    const terms=query.toLowerCase().split(/\s+/).filter(Boolean);
    const matches=terms.length?pages.filter(p=>terms.every(t=>(p.title+' '+p.source).toLowerCase().includes(t))).sort((a,b)=>Number(b.title.toLowerCase().includes(query.toLowerCase()))-Number(a.title.toLowerCase().includes(query.toLowerCase()))):[];
    $('result-count').textContent=terms.length?`${matches.length} ${matches.length===1?'article':'articles'} matching “${query}”${matches.length?'':'. Try fewer words or a broader term.'}`:'Enter a word or phrase to search all articles.';
    $('results').replaceChildren();
    for (const p of matches) {
      const card=document.createElement('div');card.className='result';
      const small=document.createElement('small');small.textContent=p.section;
      const h=document.createElement('h2'),a=link('',route(p.id));a.append(markText(p.title,query));h.append(a);
      const excerpt=document.createElement('p');
      const plain=p.source.replace(/^---\n[\s\S]*?\n---\n/,'').replace(/[#*`|]/g,'').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/\s+/g,' ');
      const position=plain.toLowerCase().indexOf(terms[0]);const start=Math.max(0,position-65);
      excerpt.append(markText((start?'…':'')+plain.slice(start,start+240)+(plain.length>start+240?'…':''),query));
      card.append(small,h,excerpt);$('results').append(card);
    }
    document.title='Search — '+wikiTitle;
  }
  function render() {
    const rawHash=location.hash.slice(1);
    document.querySelectorAll('[aria-current=page]').forEach(a=>a.removeAttribute('aria-current'));
    if(rawHash.startsWith('/search?')) {search(new URLSearchParams(rawHash.slice(8)).get('q')||'');window.scrollTo(0,0);return;}
    let id='index',anchor='';
    try {
      const parts=(rawHash.startsWith('/')?rawHash.slice(1):'index').split('~');
      id=decodeURIComponent(parts[0]);anchor=decodeURIComponent(parts[1]||'');
    } catch {id='__invalid_route__';}

    const p=byId.get(id||'index');
    $('search-results').hidden=true;document.querySelector('.toolbar').hidden=!p;$('page-meta').hidden=!p;
    current=p||null;mode(false);
    if(!p){
      $('page-title').textContent='Page not found';
      $('article').replaceChildren(link('Return to the main page',route('index')));$('toc').replaceChildren();$('backlinks').hidden=true;document.title='Page not found — '+wikiTitle;return;
    }
    $('search').value='';$('page-title').textContent=p.title;
    $('page-meta').innerHTML=p.metadataHtml;
    $('page-meta').hidden=!p.metadataHtml;
    $('article').innerHTML=p.html;
    $('source-text').textContent=p.source;$('source-path').textContent=p.id+'.md';
    $('toc').replaceChildren();
    p.toc.forEach(h=>{const a=link(h.title,route(p.id)+'~'+h.id);if(h.depth>2)a.className='nested';$('toc').append(a);});
    $('backlink-list').replaceChildren();$('backlinks').hidden=!p.backlinks.length;
    p.backlinks.forEach(id=>$('backlink-list').append(link(byId.get(id).title,route(id))));
    document.querySelectorAll('[data-page]').forEach(a=>{if(a.dataset.page===p.id)a.setAttribute('aria-current','page');});
    document.title=p.id==='index'?wikiTitle:p.title+' — '+wikiTitle;
    if(anchor)requestAnimationFrame(()=>{if(anchor===p.titleAnchor)$('page-title').scrollIntoView();else document.getElementById(anchor)?.scrollIntoView();});else window.scrollTo(0,0);
  }
  $('search-form').addEventListener('submit',e=>{e.preventDefault();const hash='/search?q='+encodeURIComponent($('search').value.trim());if(location.hash==='#'+hash)render();else location.hash=hash;});
  $('read-tab').addEventListener('click',()=>mode(false));$('source-tab').addEventListener('click',()=>mode(true));
  $('print').addEventListener('click',()=>{mode(false);window.print();});
  document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();const target=$('search-results').hidden?$('article'):$('main');target.focus();target.scrollIntoView();});
  $('download').addEventListener('click',()=>{
    if(!current)return;const url=URL.createObjectURL(new Blob([current.source],{type:'text/markdown;charset=utf-8'}));
    const a=link('',url);a.download=current.id.split('/').pop()+'.md';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  });
  document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)&&!e.metaKey&&!e.ctrlKey&&!e.altKey){e.preventDefault();$('search').focus();}});
  document.addEventListener('click',e=>{const a=e.target.closest('a');if(a?.getAttribute('href')?.startsWith('#/')&&matchMedia('(max-width: 700px)').matches)$('navigation-details').open=false;});
  window.addEventListener('hashchange',render);
  render();
})();
</script>
