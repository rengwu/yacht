":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-21\u003c/span>","updated":"2026-10-21","summary":"","source":"---\ntitle: Release packaging and upgrade checks\nupdated: 2026-10-21\n---\n\n# Release packaging and upgrade checks\n\n**ID:** FEAT-release\n\nThe user requested autonomous release preparation through jstack work-until-grill, including a version bump, then authorized publication after merging PR #1. **0.2.0 is published**, following 0.1.6. Distribution remains the existing ad-hoc-signed GitHub DMG.\n\n## Expected outcomes\n\n- `VERSION`, the bundle version, and the release tag agree.\n- `./build.sh` produces a universal Apple Silicon/Intel `build/Yacht.app`, with its icons and license inside the bundle and a valid ad-hoc signature.\n- Tag releases run core and tap tests before publishing. The release includes the prepared version-specific notes.\n- The DMG contains `Yacht.app` and an Applications link. A copy outside the checkout launches and renders its bundled provider icons.\n- Upgrading preserves registered accounts and settings. Offline demo edits do not write the saved configuration.\n- Existing live profiles produce usage; expired Kimi/Grok credentials remain read-only and require the provider CLI to renew them.\n\n## Verification recipe\n\nUse [shared setup](../verification/setup.md). Run `swift run UsageCoreTests`, `bash tap/test_tap.sh`, and `./build.sh`. Inspect both version keys with `plutil`, run `lipo build/Yacht.app/Contents/MacOS/Yacht -verify_arch arm64 x86_64`, and run `codesign --verify --deep --strict build/Yacht.app`.\n\nCreate a local DMG with the release workflow's create-dmg arguments plus `--skip-jenkins` for a headless packaging check. Mount it read-only without opening Finder, copy its app into a temporary directory, verify its signature and binary hash, then eject the image. Launch that exact copy with `--demo`, check first-click rename and a display control, and inspect the usage menu with Command-U. Stop only the process created for this check, restore the normal instance, and compare the saved configuration hash.\n\nInspect Add Account discovery and cancel without saving. Live provider checks need existing signed-in profiles. Never write credentials or record tokens. Intel core execution under Rosetta is a separate check from native Intel UI validation.\n\n## Coverage and limits\n\nAutomated suites cover config migration, account identity, percentage semantics, stale states, provider payloads, and tap preservation. A local DMG launch is not a downloaded/quarantined install, and the current host cannot establish macOS 13 or physical Intel compatibility. Full VoiceOver operation and a login/logout cycle are outside this preflight.\n\n## Verification history\n\n- [0.2.0 publication](../verification/runs/2026-10-21-v0.2.0-publication.md): tag workflow passed; both published downloads, checksums, universal bundle, and signature verified.\n- [0.2.0 preflight](../verification/runs/2026-10-21-v0.2.0-preflight.md): packaging and exercised checks passed; fresh Kimi request remains untested because credentials are expired.\n","toc":[{"id":"expected-outcomes","title":"Expected outcomes","depth":2},{"id":"verification-recipe","title":"Verification recipe","depth":2},{"id":"coverage-and-limits","title":"Coverage and limits","depth":2},{"id":"verification-history","title":"Verification history","depth":2}],"titleAnchor":"release-packaging-and-upgrade-checks","links":["verification/setup","verification/runs/2026-10-21-v0.2.0-publication","verification/runs/2026-10-21-v0.2.0-preflight"],"attachments":[],"html":"\u003cp>\u003cstrong>ID:\u003c/strong> FEAT-release\u003c/p>\n\u003cp>The user requested autonomous release preparation through jstack work-until-grill, including a version bump, then authorized publication after merging PR #1. \u003cstrong>0.2.0 is published\u003c/strong>, following 0.1.6. Distribution remains the existing ad-hoc-signed GitHub DMG.\u003c/p>\n\u003ch2 id=\"expected-outcomes\">Expected outcomes\u003c/h2>\n\u003cul>\n\u003cli>\u003ccode>VERSION\u003c/code>, the bundle version, and the release tag agree.\u003c/li>\n\u003cli>\u003ccode>./build.sh\u003c/code> produces a universal Apple Silicon/Intel \u003ccode>build/Yacht.app\u003c/code>, with its icons and license inside the bundle and a valid ad-hoc signature.\u003c/li>\n\u003cli>Tag releases run core and tap tests before publishing. The release includes the prepared version-specific notes.\u003c/li>\n\u003cli>The DMG contains \u003ccode>Yacht.app\u003c/code> and an Applications link. A copy outside the checkout launches and renders its bundled provider icons.\u003c/li>\n\u003cli>Upgrading preserves registered accounts and settings. Offline demo edits do not write the saved configuration.\u003c/li>\n\u003cli>Existing live profiles produce usage; expired Kimi/Grok credentials remain read-only and require the provider CLI to renew them.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"verification-recipe\">Verification recipe\u003c/h2>\n\u003cp>Use \u003ca href=\"#/verification/setup\">shared setup\u003c/a>. Run \u003ccode>swift run UsageCoreTests\u003c/code>, \u003ccode>bash tap/test_tap.sh\u003c/code>, and \u003ccode>./build.sh\u003c/code>. Inspect both version keys with \u003ccode>plutil\u003c/code>, run \u003ccode>lipo build/Yacht.app/Contents/MacOS/Yacht -verify_arch arm64 x86_64\u003c/code>, and run \u003ccode>codesign --verify --deep --strict build/Yacht.app\u003c/code>.\u003c/p>\n\u003cp>Create a local DMG with the release workflow's create-dmg arguments plus \u003ccode>--skip-jenkins\u003c/code> for a headless packaging check. Mount it read-only without opening Finder, copy its app into a temporary directory, verify its signature and binary hash, then eject the image. Launch that exact copy with \u003ccode>--demo\u003c/code>, check first-click rename and a display control, and inspect the usage menu with Command-U. Stop only the process created for this check, restore the normal instance, and compare the saved configuration hash.\u003c/p>\n\u003cp>Inspect Add Account discovery and cancel without saving. Live provider checks need existing signed-in profiles. Never write credentials or record tokens. Intel core execution under Rosetta is a separate check from native Intel UI validation.\u003c/p>\n\u003ch2 id=\"coverage-and-limits\">Coverage and limits\u003c/h2>\n\u003cp>Automated suites cover config migration, account identity, percentage semantics, stale states, provider payloads, and tap preservation. A local DMG launch is not a downloaded/quarantined install, and the current host cannot establish macOS 13 or physical Intel compatibility. Full VoiceOver operation and a login/logout cycle are outside this preflight.\u003c/p>\n\u003ch2 id=\"verification-history\">Verification history\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"#/verification/runs/2026-10-21-v0.2.0-publication\">0.2.0 publication\u003c/a>: tag workflow passed; both published downloads, checksums, universal bundle, and signature verified.\u003c/li>\n\u003cli>\u003ca href=\"#/verification/runs/2026-10-21-v0.2.0-preflight\">0.2.0 preflight\u003c/a>: packaging and exercised checks passed; fresh Kimi request remains untested because credentials are expired.\u003c/li>\n\u003c/ul>\n","backlinks":["features/index","verification/runs/2026-10-21-v0.2.0-preflight","verification/runs/2026-10-21-v0.2.0-publication"]},{"id":"features/index","title":"Feature verification","section":"Features","order":1,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-21\u003c/span>","updated":"2026-10-21","summary":"","source":"---\ntitle: Feature verification\nupdated: 2026-10-21\norder: 1\n---\n\n# Feature verification\n\n- [Release packaging and upgrade checks](release.md)\n- [Shared verification setup](../verification/setup.md)\n\nThis bounded map covers release preparation. Existing interface behavior and prior checks remain documented in [Native implementation](../native-implementation.md).\n","toc":[],"titleAnchor":"feature-verification","links":["features/release","verification/setup","native-implementation"],"attachments":[],"html":"\u003cul>\n\u003cli>\u003ca href=\"#/features/release\">Release packaging and upgrade checks\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/verification/setup\">Shared verification setup\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp>This bounded map covers release preparation. Existing interface behavior and prior checks remain documented in \u003ca href=\"#/native-implementation\">Native implementation\u003c/a>.\u003c/p>\n","backlinks":["index"]},{"id":"journal/2026-10-19-grill-8ef2fa34-9d14-4577-827c-f7a1b51f04f7","title":"Interview answers","section":"Journal","order":0,"metadata":{"status":"Submitted"},"metadataHtml":"\u003cspan>Status: Submitted\u003c/span> \u003cspan>Last updated: 2026-10-19\u003c/span>","updated":"2026-10-19","summary":"","source":"---\ntitle: Interview answers\nsection: Journal\nupdated: 2026-10-19\nstatus: Submitted\n---\n# Interview answers\n\nSubmitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\n\nSession: `8ef2fa34-9d14-4577-827c-f7a1b51f04f7`\n\n## Question 1\n\n```text\nRound: Start over — Round 1: purpose and constraints\nQuestion: What is the single most important question this app should answer?\nDescription (Markdown source):\nThe previous design assumed a broad dashboard. This round starts with the job you need done, not that layout. Use Notes to describe a concrete situation if the choices miss it.\nRecommendation: Start with usage headroom and reset times: one narrow job that can be useful at a glance. This is a proposal, not an assumed decision.\nOptions: How much usage do my accounts have left, and when does it reset? / Which account or provider should I use next? / What am I spending on subscriptions, and are they worth keeping?\nSelected: How much usage do my accounts have left, and when does it reset?\nNotes:\n```\n\n## Question 2\n\n```text\nRound: Start over — Round 1: purpose and constraints\nQuestion: Whose workflow should the first version optimize for?\nDescription (Markdown source):\n\nRecommendation: Optimize for your own daily workflow first, so real usage determines the requirements before adding general-purpose setup.\nOptions: My own workflow / A small group of developers with similar setups / A public macOS utility that strangers can install and use\nSelected: My own workflow\nNotes:\n```\n\n## Question 3\n\n```text\nRound: Start over — Round 1: purpose and constraints\nQuestion: How should we interpret lightweight when making tradeoffs?\nDescription (Markdown source):\nYou have already required lightweight and minimal. This determines whether simplicity is chiefly about the visible interface or also a hard resource constraint. Exact budgets can be set after we settle the scope.\nRecommendation: Treat both minimal UI and low idle CPU/memory as hard constraints; require a clear benefit for any background work or dependency.\nOptions: Minimal UI and low resource use are both hard constraints / Minimal UI matters most; ordinary native-app resource use is acceptable / Low resource use matters most; a richer interface is acceptable if efficient\nSelected: Minimal UI and low resource use are both hard constraints\nNotes:\n```\n\n## Question 4\n\n```text\nRound: Start over — Round 1: purpose and constraints\nQuestion: Does native Swift impose a specific UI framework requirement?\nDescription (Markdown source):\nThe current utility uses AppKit; the rejected redesign added SwiftUI. Both are native Swift options. Choosing between them is separate from accepting any previous layout.\nRecommendation: Use AppKit and standard macOS controls as the starting constraint for this small utility; revisit only if a settled requirement warrants it.\nOptions: AppKit and standard macOS controls / SwiftUI is acceptable, provided the app stays minimal / Either native framework; decide from the agreed behavior and measured footprint\nSelected: SwiftUI is acceptable, provided the app stays minimal\nNotes:\n```\n\n## Question 5\n\n```text\nRound: Start over — Round 1: purpose and constraints\nQuestion: What application surfaces are acceptable?\nDescription (Markdown source):\n\nRecommendation: A menu bar dropdown plus a small settings window. That fits a utility checked briefly while working.\nOptions: Menu bar dropdown and settings only / Everything in the menu bar dropdown, including configuration / Menu bar first, with an optional detail window when needed\nSelected: Menu bar dropdown and settings only\nNotes:\n```\n\n## Question 6\n\n```text\nRound: Start over — Round 1: purpose and constraints\nQuestion: How many accounts should feel effortless to monitor at once?\nDescription (Markdown source):\nThis is a design target, not a request to inventory your current folders. Multiple accounts are already a requirement.\nRecommendation: Target four to eight accounts comfortably; define overflow behavior for larger collections later.\nOptions: Two or three accounts / Four to eight accounts / Nine or more accounts\nSelected: Four to eight accounts\nNotes:\n```\n\n## Question 7\n\n```text\nRound: Start over — Round 1: purpose and constraints\nQuestion: What provider breadth should the first version cover?\nDescription (Markdown source):\nThe existing repository has Claude, Kimi, and Codex adapters, plus pre-existing uncommitted Grok work. Their existence does not require accepting them all into the new scope.\nRecommendation: Keep the existing four providers in scope if you use them, while keeping account behavior consistent; do not add new integrations during the reset.\nOptions: Claude, Codex, Kimi, and Grok / Claude and Codex first / Only the providers I specify in Notes\nSelected: Claude, Codex, Kimi, and Grok\nNotes:\n```\n\n## Question 8\n\n```text\nRound: Start over — Round 1: purpose and constraints\nQuestion: What should throwing everything away mean for the source code?\nDescription (Markdown source):\nThe working tree contains my rejected redesign mixed with Grok work that existed before it. No source cleanup has happened yet. This answer defines the cleanup boundary.\nRecommendation: Remove the rejected redesign edits while preserving the earlier Grok work and established provider behavior. Reconsider reuse after the requirements are settled.\nOptions: Remove only the rejected redesign edits; preserve earlier work / Keep the code parked while we discuss; decide cleanup later / Start a separate clean implementation and keep the existing repository as a reference / Discard all uncommitted work, including the earlier Grok work\nSelected: Remove only the rejected redesign edits; preserve earlier work\nNotes:\n```\n","toc":[{"id":"question-1","title":"Question 1","depth":2},{"id":"question-2","title":"Question 2","depth":2},{"id":"question-3","title":"Question 3","depth":2},{"id":"question-4","title":"Question 4","depth":2},{"id":"question-5","title":"Question 5","depth":2},{"id":"question-6","title":"Question 6","depth":2},{"id":"question-7","title":"Question 7","depth":2},{"id":"question-8","title":"Question 8","depth":2}],"titleAnchor":"interview-answers","links":[],"attachments":[],"html":"\u003cp>Submitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\u003c/p>\n\u003cp>Session: \u003ccode>8ef2fa34-9d14-4577-827c-f7a1b51f04f7\u003c/code>\u003c/p>\n\u003ch2 id=\"question-1\">Question 1\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Start over — Round 1: purpose and constraints\nQuestion: What is the single most important question this app should answer?\nDescription (Markdown source):\nThe previous design assumed a broad dashboard. This round starts with the job you need done, not that layout. Use Notes to describe a concrete situation if the choices miss it.\nRecommendation: Start with usage headroom and reset times: one narrow job that can be useful at a glance. This is a proposal, not an assum wift impose a specific UI framework requirement?\nDescription (Markdown source):\nThe current utility uses AppKit; the rejected redesign added SwiftUI. Both are native Swift options. Choosing between them is separate from accepting any previous layout.\nRecommendation: Use AppKit and standard macOS controls as the starting constraint for this small utility; revisit only if a settled requirement warrants it.\nOptions: AppKit and standard macOS controls / SwiftUI is acceptable, provided the app stays minimal / Either native framework; decide from the agreed behavior and measured footprint\nSelected: SwiftUI is acceptable, provided the app stays minimal\nNotes:\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-5\">Question 5\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Start over — Round 1: purpose and constraints\nQuestion: What application surfaces are acceptable?\nDescription (Markdown source):\n\nRecommendation: A menu bar dropdown plus a small settings window. That fits a utility checked briefly while working.\nOptions: Menu bar dropdown and settings only / Everything in the menu bar dropdown, including configuration / Menu bar first, with an optional detail window when needed\nSelected: Menu bar dropdown and settings only\nNotes:\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-6\">Question 6\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Start over — Round 1: purpose and constraints\nQuestion: How many accounts should feel effortless to monitor at once?\nDescription (Markdown source):\nThis is a design target, not a request to inventory your current folders. Multiple accounts are already a requirement.\nRecommendation: Target four to eight accounts comfortably; define overflow behavior for larger collections later.\nOptions: Two or three accounts / Four to eight accounts / Nine or more accounts\nSelected: Four to eight accounts\nNotes:\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-7\">Question 7\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Start over — Round 1: purpose and constraints\nQuestion: What provider breadth should the first version cover?\nDescription (Markdown source):\nThe existing repository has Claude, Kimi, and Codex adapters, plus pre-existing uncommitted Grok work. Their existence does not require accepting them all into the new scope.\nRecommendation: Keep the existing four providers in scope if you use them, while keeping account behavior consistent; do not add new integrations during the reset.\nOptions: Claude, Codex, Kimi, and Grok / Claude and Codex first / Only the providers I specify in Notes\nSelected: Claude, Codex, Kimi, and Grok\nNotes:\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-8\">Question 8\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Start over — Round 1: purpose and constraints\nQuestion: What should throwing everything away mean for the source code?\nDescription (Markdown source):\nThe working tree contains my rejected redesign mixed with Grok work that existed before it. No source cleanup has happened yet. This answer defines the cleanup boundary.\nRecommendation: Remove the rejected redesign edits while preserving the earlier Grok work and established provider behavior. Reconsider reuse after the requirements are settled.\nOptions: Remove only the rejected redesign edits; preserve earlier work / Keep the code parked while we discuss; decide cleanup later / Start a separate clean implementation and keep the existing repository as a reference / Discard all uncommitted work, including the earlier Grok work\nSelected: Remove only the rejected redesign edits; preserve earlier work\nNotes:\n\u003c/code>\u003c/pre>\n","backlinks":["index","plan","mockup-handoff"]},{"id":"journal/2026-10-19-grill-b89a23b6-c6c3-4fbb-934f-22325c1fb909","title":"Interview answers","section":"Journal","order":0,"metadata":{"status":"Submitted"},"metadataHtml":"\u003cspan>Status: Submitted\u003c/span> \u003cspan>Last updated: 2026-10-19\u003c/span>","updated":"2026-10-19","summary":"","source":"---\ntitle: Interview answers\nsection: Journal\nupdated: 2026-10-19\nstatus: Submitted\n---\n# Interview answers\n\nSubmitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\n\nSession: `b89a23b6-c6c3-4fbb-934f-22325c1fb909`\n\n## Question 9\n\n```text\nRound: Round 2 — what you see during the day\nQuestion: What should remain visible in the menu bar when the dropdown is closed?\nDescription (Markdown source):\nWe have settled on four to eight accounts and a menu bar utility. Showing every account continuously uses more menu bar width; there is no meaningful combined quota percentage across separate subscriptions.\nRecommendation: Show one account you explicitly choose, with its percentage. Keep that choice stable instead of silently switching to whichever account is most depleted.\nOptions: An icon only; all usage appears on click / An icon and usage for one account I choose / Short usage figures for every account I choose to show\nSelected: (notes only)\nNotes: customizable. supports short usage figures for each enabled account.\n```\n\n## Question 10\n\n```text\nRound: Round 2 — what you see during the day\nQuestion: Should the main percentage describe usage remaining or usage consumed?\nDescription (Markdown source):\nFor the same account, 30% used and 70% left describe the same state. We should use a consistent convention rather than making you mentally invert it between views.\nRecommendation: Use an explicit remaining value, such as 70% left, to match the question you want the app to answer.\nOptions: Remaining: 70% left / Consumed: 30% used / Make remaining versus used a setting\nSelected: Make remaining versus used a setting\nNotes:\n```\n\n## Question 11\n\n```text\nRound: Round 2 — what you see during the day\nQuestion: Which quota windows should be visible immediately when you open the dropdown?\nDescription (Markdown source):\nProviders can report different windows. Some accounts have a short session limit and a weekly limit; another may report only one. A missing window must not be invented.\nRecommendation: Show all reported windows for each account in compact rows. A weekly limit can matter even when the short window has plenty left.\nOptions: All reported windows for every account / Only the provider's primary window; reveal the others on demand / One window type at a time, switched for the whole dropdown\nSelected: All reported windows for every account\nNotes:\n```\n\n## Question 12\n\n```text\nRound: Round 2 — what you see during the day\nQuestion: How should accounts be grouped and ordered?\nDescription (Markdown source):\n\nRecommendation: Group by provider, with your chosen order inside each group. Stable positions make repeated glances easier.\nOptions: Grouped by provider, with a stable order I control / One flat list in an order I control / Automatically order by least remaining usage\nSelected: One flat list in an order I control\nNotes:\n```\n\n## Question 13\n\n```text\nRound: Round 2 — what you see during the day\nQuestion: What basic visual structure should the dropdown use?\nDescription (Markdown source):\nThis chooses the interface's structure, not colors or branding. The full dashboard and large account cards are already rejected.\nRecommendation: Start with a plain native menu: concise text, light separators, and small usage indicators only where useful.\nOptions: Plain native menu rows, mostly text / A compact custom native table with aligned columns / Show rough alternatives before I choose\nSelected: Show rough alternatives before I choose\nNotes:\n```\n\n## Question 14\n\n```text\nRound: Round 2 — what you see during the day\nQuestion: How should a reset time be displayed?\nDescription (Markdown source):\n\nRecommendation: Show time remaining, such as 2h 15m, and make the exact local reset time available on hover. This answers how long you need to wait without filling each row with timestamps.\nOptions: Countdown, with exact time available on hover / Exact local time and day / Both countdown and exact time directly in the row\nSelected: Both countdown and exact time directly in the row\nNotes: either one, up to my choosing\n```\n\n## Question 15\n\n```text\nRound: Round 2 — what you see during the day\nQuestion: How fresh should readings stay while you are not opening the dropdown?\nDescription (Markdown source):\nThe existing pulled providers use roughly one-minute polling while active and fifteen-minute polling while idle, with a refresh attempt on opening. Claude reads local snapshots. Keeping figures fresh has a background-work cost; the precise implementation will be measured later.\nRecommendation: Retain adaptive updates as the initial policy, then measure their cost for four to eight accounts before setting the final resource budget.\nOptions: Adaptive background updates, plus refresh on opening / Slow background updates, around every five minutes, plus refresh on opening / Refresh only when I open the dropdown or request it\nSelected: Adaptive background updates, plus refresh on opening\nNotes:\n```\n\n## Question 16\n\n```text\nRound: Round 2 — what you see during the day\nQuestion: What should happen when fresh usage cannot be obtained but a previous reading exists?\nDescription (Markdown source):\n\nRecommendation: Keep the last reading, visibly marked as saved or stale with its age and a short reason. Never present it as a current reading.\nOptions: Keep the previous reading with a stale marker and age / Replace the number with unavailable until a fresh reading arrives / Keep the previous reading, with details only on hover\nSelected: Keep the previous reading with a stale marker and age\nNotes:\n```\n\n## Question 17\n\n```text\nRound: Round 2 — what you see during the day\nQuestion: After a saved reset time passes, what should the app show before another reading arrives?\nDescription (Markdown source):\nThe existing implementation infers an empty window after its reset. That can be misleading if the account has already been used elsewhere. Restarting the design gives us a chance to choose this explicitly.\nRecommendation: Show reset passed or awaiting update without claiming a new percentage until the provider confirms it.\nOptions: Unknown percentage with reset passed or awaiting update / Assume full capacity, explicitly marked as estimated / Keep the old percentage, explicitly marked as expired\nSelected: Unknown percentage with reset passed or awaiting update\nNotes:\n```\n\n## Question 18\n\n```text\nRound: Round 2 — what you see during the day\nQuestion: Should this utility interrupt you with usage notifications?\nDescription (Markdown source):\n\nRecommendation: Keep it passive for the first version: warnings stay in the menu bar and dropdown. Add notifications only if they solve a recurring problem in your workflow.\nOptions: No notifications; visual indicators only / Notify once when an account nears a limit / Notify only when a limit has actually been reached\nSelected: No notifications; visual indicators only\nNotes:\n```\n","toc":[{"id":"question-9","title":"Question 9","depth":2},{"id":"question-10","title":"Question 10","depth":2},{"id":"question-11","title":"Question 11","depth":2},{"id":"question-12","title":"Question 12","depth":2},{"id":"question-13","title":"Question 13","depth":2},{"id":"question-14","title":"Question 14","depth":2},{"id":"question-15","title":"Question 15","depth":2},{"id":"question-16","title":"Question 16","depth":2},{"id":"question-17","title":"Question 17","depth":2},{"id":"question-18","title":"Question 18","depth":2}],"titleAnchor":"interview-answers","links":[],"attachments":[],"html":"\u003cp>Submitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\u003c/p>\n\u003cp>Session: \u003ccode>b89a23b6-c6c3-4fbb-934f-22325c1fb909\u003c/code>\u003c/p>\n\u003ch2 id=\"question-9\">Question 9\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Round 2 — what you see during the day\nQuestion: What should remain visible in the menu bar when the dropdown is closed?\nDescription (Markdown source):\nWe have settled on four to eight accounts and a menu bar utility. Showing every account continuously uses more menu bar width; there is no meaningful combined quota percentage across separate subscriptions.\nRecommendation: Show one account you explicitly choose, with its percentage. Keep that choice stable instead of silently switching to whichever account is most depleted.\nOptions: An icon only; all usage appears on click / An icon and usage for one account I choose / Short usage figures for every account I choose to show\nSelected: (notes only)\nNotes: customizable. supports short usage figures for each enabled account.\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-10\">Question 10\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Round 2 — what you see during the day\nQuestion: Should the main percentage describe usage remaining or usage consumed?\nDescription (Markdown source):\nFor the same account, 30% used and 70% left describe the same state. We should use a consistent convention rather than making you mentally invert it between views.\nRecommendation: Use an explicit remaining value, such as 70% left, to match the question you want the app to answer.\nOptions: Remaining: 70% left / Consumed: 30% used / Make remaining versus used a setting\nSelected: Make remaining versus used a setting\nNotes:\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-11\">Question 11\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Round 2 — what you see during the day\nQuestion: Which quota windows should be visible immediately when you open the dropdown?\nDescription (Markdown source):\nProviders can report different windows. Some accounts have a short session limit and a weekly limit; another may report only one. A missing window must not be invented.\nRecommendation: Show all reported windows for each account in compact rows. A weekly limit can matter even when the short window has plenty left.\nOptions: All reported windows for every account / Only the provider's primary window; reveal the others on demand / One window type at a time, switched for the whole dropdown\nSelected: All reported windows for every account\nNotes:\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-12\">Question 12\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Round 2 — what you see during the day\nQuestion: How should accounts be grouped and ordered?\nDescription (Markdown source):\n\nRecommendation: Group by provider, with your chosen order inside each group. Stable positions make repeated glances easier.\nOptions: Grouped by provider, with a stable order I control / One flat list in an order I control / Automatically order by least remaining usage\nSelected: One flat list in an order I control\nNotes:\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-13\">Question 13\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Round 2 — what you see during the day\nQuestion: What basic visual structure should the dropdown use?\nDescription (Markdown source):\nThis chooses the interface's structure, not colors or branding. The full dashboard and large account cards are already rejected.\nRecommendation: Start with a plain native menu: concise text, light separators, and small usage indicators only where useful.\nOptions: Plain native menu rows, mostly text / A compact custom native table with aligned columns / Show rough alternatives before I choose\nSelected: Show rough alternatives before I choose\nNotes:\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-14\">Question 14\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Round 2 — what you see during the day\nQuestion: How should a reset time be displayed?\nDescription (Markdown source):\n\nRecommendation: Show time remaining, such as 2h 15m, and make the exact local reset time available on hover. This answers how long you need to wait without filling each row with timestamps.\nOptions: Countdown, with exact time available on hover / Exact local time and day / Both countdown and exact time directly in the row\nSelected: Both countdown and exact time directly in the row\nNotes: either one, up to my choosing\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-15\">Question 15\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Round 2 — what you see during the day\nQuestion: How fresh should readings stay while you are not opening the dropdown?\nDescription (Markdown source):\nThe existing pulled providers use roughly one-minute polling while active and fifteen-minute polling while idle, with a refresh attempt on opening. Claude reads local snapshots. Keeping figures fresh has a background-work cost; the precise implementation will be measured later.\nRecommendation: Retain adaptive updates as the initial policy, then measure their cost for four to eight accounts before setting the final resource budget.\nOptions: Adaptive background updates, plus refresh on opening / Slow background updates, around every five minutes, plus refresh on opening / Refresh only when I open the dropdown or request it\nSelected: Adaptive background updates, plus refresh on opening\nNotes:\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-16\">Question 16\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Round 2 — what you see during the day\nQuestion: What should happen when fresh usage cannot be obtained but a previous reading exists?\nDescription (Markdown source):\n\nRecommendation: Keep the last reading, visibly marked as saved or stale with its age and a short reason. Never present it as a current reading.\nOptions: Keep the previous reading with a stale marker and age / Replace the number with unavailable until a fresh reading arrives / Keep the previous reading, with details only on hover\nSelected: Keep the previous reading with a stale marker and age\nNotes:\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-17\">Question 17\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Round 2 — what you see during the day\nQuestion: After a saved reset time passes, what should the app show before another reading arrives?\nDescription (Markdown source):\nThe existing implementation infers an empty window after its reset. That can be misleading if the account has already been used elsewhere. Restarting the design gives us a chance to choose this explicitly.\nRecommendation: Show reset passed or awaiting update without claiming a new percentage until the provider confirms it.\nOptions: Unknown percentage with reset passed or awaiting update / Assume full capacity, explicitly marked as estimated / Keep the old percentage, explicitly marked as expired\nSelected: Unknown percentage with reset passed or awaiting update\nNotes:\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-18\">Question 18\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Round 2 — what you see during the day\nQuestion: Should this utility interrupt you with usage notifications?\nDescription (Markdown source):\n\nRecommendation: Keep it passive for the first version: warnings stay in the menu bar and dropdown. Add notifications only if they solve a recurring problem in your workflow.\nOptions: No notifications; visual indicators only / Notify once when an account nears a limit / Notify only when a limit has actually been reached\nSelected: No notifications; visual indicators only\nNotes:\n\u003c/code>\u003c/pre>\n","backlinks":["index","plan","mockup-handoff"]},{"id":"journal/2026-10-20-grill-1664761b-a44e-468f-a6d4-1ce37f6b63ad","title":"Interview answers","section":"Journal","order":0,"metadata":{"status":"Submitted"},"metadataHtml":"\u003cspan>Status: Submitted\u003c/span> \u003cspan>Last updated: 2026-10-20\u003c/span>","updated":"2026-10-20","summary":"","source":"---\ntitle: Interview answers\nsection: Journal\nupdated: 2026-10-20\nstatus: Submitted\n---\n# Interview answers\n\nSubmitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\n\nSession: `1664761b-a44e-468f-a6d4-1ce37f6b63ad`\n\n## Question 24\n\n```text\nRound: Mockup round 3 decisions\nQuestion: Which provider icon set should the app use?\nDescription (Markdown source):\nBoth sets are MIT-licensed; the logos themselves stay their owners' trademarks. Letter tiles remain the fallback either way. See the *Provider icon sources* board on the Round 3 page.\n\n| Set | Style | Coverage |\n| --- | --- | --- |\n| Lobe Icons | Filled brand marks | Claude, Codex, Grok, Kimi |\n| Hugeicons (free) | Outline marks | Claude, Grok, Kimi; no Codex, so the ChatGPT mark stands in |\n\nThe native app would bundle the chosen marks as small monochrome template images, so they tint correctly in light and dark menu bars.\nRecommendation: Lobe Icons: it covers all four providers, and its solid shapes stay legible at the 14 px menu bar size.\nOptions: Lobe Icons / Hugeicons / Letter tiles only\nSelected: Lobe Icons\nNotes:\n```\n\n## Question 25\n\n```text\nRound: Mockup round 3 decisions\nQuestion: Which glyph should mark a window whose reset time has passed while it waits for new data?\nDescription (Markdown source):\nThe refresh arrow and `?` were rejected. In every option the glyph replaces the percentage, the meter becomes a dashed track, and the glyph is neutral grey because nothing is wrong. See *Awaiting-update glyph options* on the Round 3 page.\n\n| Option | Reads as |\n| --- | --- |\n| Hourglass | Waiting for the next reading |\n| Three dots | Pending; the lightest mark |\n| Dashed ring | An empty value; can look like a loading spinner at small sizes |\nRecommendation: Hourglass: it says 'waiting' most directly and cannot be mistaken for a button or a loading spinner.\nOptions: Hourglass / Three dots / Dashed ring\nSelected: (notes only)\nNotes: instead of  \"Hourglass\" \"Three dots\"  \"Dashed ring\" can't u actually show me the icons instead?\n\nis it a grill-form limitation?\n```\n\n## Question 26\n\n```text\nRound: Mockup round 3 decisions\nQuestion: Should one 'Show accounts as: Icons / Labels' setting control both the menu bar and the dropdown?\nDescription (Markdown source):\nYou said entries must never mix icons and labels. With one setting:\n\n| Setting | Menu bar | Dropdown headers |\n| --- | --- | --- |\n| Icons | Style 2: icon + % | Icon + label |\n| Labels | Style 4: label over % | Label only |\n\nSeparate settings would allow, for example, labels in the menu bar and icons in the dropdown. That costs one more control.\nRecommendation: One setting: it is the fewest controls, and the two surfaces always look consistent.\nOptions: One setting for both / Separate settings for menu bar and dropdown\nSelected: One setting for both\nNotes:\n```\n\n## Question 27\n\n```text\nRound: Mockup round 3 decisions\nQuestion: What should the default for 'Show accounts as' be?\nDescription (Markdown source):\nWith icons, accounts from the same provider (Work and Home, both Claude) look identical in the menu bar, and only their order tells them apart. Labels avoid that and fit eight accounts beside the notch. Icons are narrower and quicker to scan when every provider appears only once.\nRecommendation: Labels: your workload has several accounts per provider, and labels are never ambiguous. Icons stay one click away.\nOptions: Labels / Icons\nSelected: Labels\nNotes:\n```\n\n## Question 28\n\n```text\nRound: Mockup round 3 decisions\nQuestion: What should the default percentage convention be?\nDescription (Markdown source):\nRemaining versus used is already an accepted setting; only its default is open. The primary job is 'how much usage each account has left'.\nRecommendation: Remaining: it answers the primary question directly, and a full meter means plenty left.\nOptions: Remaining / Used\nSelected: Used\nNotes:\n```\n\n## Question 29\n\n```text\nRound: Mockup round 3 decisions\nQuestion: What should the default reset display be?\nDescription (Markdown source):\nCountdown versus exact time is already an accepted setting; only its default is open. Countdown reads `2h 14m`; exact time reads `11:55` or `Fri 13:40`.\nRecommendation: Countdown: 'how long until I can work again' is the usual question, and it needs no mental arithmetic.\nOptions: Countdown / Exact time\nSelected: Countdown\nNotes:\n```\n\n## Question 30\n\n```text\nRound: Mockup round 3 decisions\nQuestion: How should a stale reading look in the menu bar?\nDescription (Markdown source):\nA stale reading is a previous value kept after a refresh failed. In the dropdown, the values dim and a clock glyph shows the age (for example, 18m); the requirements say stale readings show their age. In the menu bar, the mockups currently only dim the figure.\nRecommendation: Dim only: it adds no width, and the dropdown shows the clock and age when you look closer.\nOptions: Dim only / Dim plus a small clock glyph / No menu bar marker\nSelected: Dim only\nNotes:\n```\n\n## Question 31\n\n```text\nRound: Mockup round 3 decisions\nQuestion: Should meters change colour when little usage is left?\nDescription (Markdown source):\nThe mockups use one accent colour for every meter. The earlier app had configurable warning and critical colour thresholds, but that is not an accepted requirement. Notifications are excluded; indicators stay visual.\n\n| Option | Cost |\n| --- | --- |\n| One colour (system accent) | None; an empty meter already shows exhaustion |\n| Fixed low colour (for example, orange under 10%) | No setting, but a built-in threshold |\n| Configurable thresholds | Two more settings |\nRecommendation: One colour from the system accent: it is the leanest, the most native, and the meter length already carries the signal.\nOptions: One colour (system accent) / Fixed low colour, no setting / Configurable thresholds\nSelected: Configurable thresholds\nNotes:\n```\n\n## Question 32\n\n```text\nRound: Mockup round 3 decisions\nQuestion: Should the dropdown include 'Quit Yacht'?\nDescription (Markdown source):\nThe accepted dropdown actions are refresh and settings. Yacht has no Dock icon, so without a Quit item the only ways to quit are Activity Monitor or a Quit button placed in Settings.\nRecommendation: Keep Quit in the dropdown: it is the standard place for a menu bar app, and it needs no extra window.\nOptions: Keep Quit in the dropdown / Move Quit into Settings / No Quit control\nSelected: Keep Quit in the dropdown\nNotes:\n```\n\n## Question 33\n\n```text\nRound: Mockup round 3 decisions\nQuestion: Do you approve the recommended account setup: choose a provider, pick that account's existing folder, and set a label?\nDescription (Markdown source):\nRecommendation from the plan, shown on the *Add account* board (Round 1 page). Each account of the same provider uses its own folder. Folders found on the Mac appear as optional 'Use' shortcuts into the same flow. Signing in stays with each provider's own CLI; Yacht only reads the folder. Claude accounts then offer Install Tap. This reuses the existing account model and folder picker, so it adds no new credential handling.\nRecommendation: Approve: it is the simplest complete fit, it supports several accounts per provider, and it reuses code that already works.\nOptions: Approve / Approve, but without the 'Found on this Mac' shortcuts / Explore a different flow\nSelected: Approve\nNotes:\n```\n","toc":[{"id":"question-24","title":"Question 24","depth":2},{"id":"question-25","title":"Question 25","depth":2},{"id":"question-26","title":"Question 26","depth":2},{"id":"question-27","title":"Question 27","depth":2},{"id":"question-28","title":"Question 28","depth":2},{"id":"question-29","title":"Question 29","depth":2},{"id":"question-30","title":"Question 30","depth":2},{"id":"question-31","title":"Question 31","depth":2},{"id":"question-32","title":"Question 32","depth":2},{"id":"question-33","t ted":"2026-10-20","summary":"","source":"---\ntitle: Interview answers\nsection: Journal\nupdated: 2026-10-20\nstatus: Submitted\n---\n# Interview answers\n\nSubmitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\n\nSession: `6f40375f-6228-48e1-972d-055c180fcfbe`\n\n## Question 19\n\n```text\nRound: Round 3 — final behavior choices before mockups\nQuestion: Which quota windows should an enabled account be able to show in its closed-menu-bar figures?\nDescription (Markdown source):\nYou want customizable short figures for each enabled account. Some providers report more than one quota window. The dropdown will still show all reported windows; this question only concerns the closed menu bar.\nRecommendation: Let you choose which reported windows appear for each account, including more than one. The mockups should show the width tradeoff clearly, without combining independent quotas.\nOptions: The provider's primary window only / One window I choose per account / Any reported windows I choose per account, including multiple\nSelected: One window I choose per account\nNotes:\n```\n\n## Question 20\n\n```text\nRound: Round 3 — final behavior choices before mockups\nQuestion: How should each account be identified in the dropdown?\nDescription (Markdown source):\nYou chose a flat list in your own order, so entries need to remain recognizable when accounts from different providers are adjacent. Existing account records have a provider and editable label; email availability has not been established for every provider.\nRecommendation: Use your editable label plus a small provider identifier. This supports names such as Work and Personal without depending on email being available.\nOptions: My editable label plus a provider identifier / Email or provider account identity when available, with an editable label as fallback / My editable label plus secondary email or identity when available\nSelected: Something else\nNotes: full customization. i'm able to customize a per-entry label, or enable the provider icon per-entry. somewhat similar to the original implementation\n```\n\n## Question 21\n\n```text\nRound: Round 3 — final behavior choices before mockups\nQuestion: How should adding an account work in the first version?\nDescription (Markdown source):\nThe current app registers local provider profiles/config folders. It can suggest some discovered profiles and also accept a folder you select. Signing in inside this utility would be a new capability whose provider support still needs verification.\nRecommendation: Offer discovered local profiles for you to select, with a manual folder option. This keeps setup close to the existing workflow and avoids inventing sign-in capabilities in the mockups.\nOptions: Select discovered local profiles, with a manual folder option / Choose the provider and folder manually for every account / I want to sign in and manage accounts inside this app\nSelected: Something else\nNotes: about this, which one is the cleanest and leanest (following jstack's rule-lean) implementation? while still supporting multiple accounts from the same provider.\n```\n\n## Question 22\n\n```text\nRound: Round 3 — final behavior choices before mockups\nQuestion: Beyond showing usage, what account actions belong in the dropdown?\nDescription (Markdown source):\nA monitoring utility, a shortcut to a provider's site, and a tool that switches active CLI/app accounts have different scopes. Opening a provider site does not guarantee it opens the matching signed-in account. Actual switching would require further behavior and feasibility decisions.\nRecommendation: Keep this version focused on monitoring, with refresh and settings. If account switching is essential to your workflow, choose it explicitly so the next session does not design a passive tracker by mistake.\nOptions: Monitoring only, with refresh and settings / Also let me open the provider's site or app / Also let me switch the active account used by the provider's CLI or app\nSelected: Monitoring only, with refresh and settings\nNotes: keep things simple please. no invented features. rule-lean\n```\n\n## Question 23\n\n```text\nRound: Round 3 — final behavior choices before mockups\nQuestion: Which reset-display modes should the setting offer?\nDescription (Markdown source):\nIn round 2 you selected both countdown and exact time, then wrote 'either one, up to my choosing'. User choice is clear; this only resolves whether a combined mode is also wanted.\nRecommendation: Offer Countdown, Exact time, and Both. That accommodates both your selection and your note while leaving the default for mockup review.\nOptions: Countdown, exact time, or both / Countdown or exact time; no combined mode\nSelected: Countdown or exact time; no combined mode\nNotes:\n```\n","toc":[{"id":"question-19","title":"Question 19","depth":2},{"id":"question-20","title":"Question 20","depth":2},{"id":"question-21","title":"Question 21","depth":2},{"id":"question-22","title":"Question 22","depth":2},{"id":"question-23","title":"Question 23","depth":2}],"titleAnchor":"interview-answers","links":[],"attachments":[],"html":"\u003cp>Submitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\u003c/p>\n\u003cp>Session: \u003ccode>6f40375f-6228-48e1-972d-055c180fcfbe\u003c/code>\u003c/p>\n\u003ch2 id=\"question-19\">Question 19\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Round 3 — final behavior choices before mockups\nQuestion: Which quota windows should an enabled account be able to show in its closed-menu-bar figures?\nDescription (Markdown source):\nYou want customizable short figures for each enabled account. Some providers report more than one quota window. The dropdown will still show all reported windows; this question only concerns the closed menu bar.\nRecommendation: Let you choose which reported windows appear for each account, including more than one. The mockups should ose to the existing workflow and avoids inventing sign-in capabilities in the mockups.\nOptions: Select discovered local profiles, with a manual folder option / Choose the provider and folder manually for every account / I want to sign in and manage accounts inside this app\nSelected: Something else\nNotes: about this, which one is the cleanest and leanest (following jstack's rule-lean) implementation? while still supporting multiple accounts from the same provider.\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-22\">Question 22\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Round 3 — final behavior choices before mockups\nQuestion: Beyond showing usage, what account actions belong in the dropdown?\nDescription (Markdown source):\nA monitoring utility, a shortcut to a provider's site, and a tool that switches active CLI/app accounts have different scopes. Opening a provider site does not guarantee it opens the matching signed-in account. Actual switching would require further behavior and feasibility decisions.\nRecommendation: Keep this version focused on monitoring, with refresh and settings. If account switching is essential to your workflow, choose it explicitly so the next session does not design a passive tracker by mistake.\nOptions: Monitoring only, with refresh and settings / Also let me open the provider's site or app / Also let me switch the active account used by the provider's CLI or app\nSelected: Monitoring only, with refresh and settings\nNotes: keep things simple please. no invented features. rule-lean\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-23\">Question 23\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Round 3 — final behavior choices before mockups\nQuestion: Which reset-display modes should the setting offer?\nDescription (Markdown source):\nIn round 2 you selected both countdown and exact time, then wrote 'either one, up to my choosing'. User choice is clear; this only resolves whether a combined mode is also wanted.\nRecommendation: Offer Countdown, Exact time, and Both. That accommodates both your selection and your note while leaving the default for mockup review.\nOptions: Countdown, exact time, or both / Countdown or exact time; no combined mode\nSelected: Countdown or exact time; no combined mode\nNotes:\n\u003c/code>\u003c/pre>\n","backlinks":["index","plan","mockup-handoff"]},{"id":"journal/2026-10-20-grill-94e43e24-0344-4592-9f1e-8eee6e7b6cb6","title":"Interview answers","section":"Journal","order":0,"metadata":{"status":"Submitted"},"metadataHtml":"\u003cspan>Status: Submitted\u003c/span> \u003cspan>Last updated: 2026-10-20\u003c/span>","updated":"2026-10-20","summary":"","source":"---\ntitle: Interview answers\nsection: Journal\nupdated: 2026-10-20\nstatus: Submitted\n---\n# Interview answers\n\nSubmitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\n\nSession: `94e43e24-0344-4592-9f1e-8eee6e7b6cb6`\n\n## Question 25\n\n```text\nRound: Reset glyph and colour thresholds\nQuestion: Which glyph should mark a window whose reset time has passed while it waits for new data?\nDescription (Markdown source):\nAsked again with the glyphs visible. This form can't show images or SVG (it renders Markdown only), so these are close Unicode look-alikes:\n\n# ⧖ · ⋯ · ◌\n\n| Glyph | Name | Reads as | Native SF Symbol |\n| --- | --- | --- | --- |\n| ⧖ | Hourglass | Waiting for the next reading | `hourglass` |\n| ⋯ | Three dots | Pending; the lightest mark | `ellipsis` |\n| ◌ | Dashed ring | An empty value; may resemble a loading spinner | `circle.dashed` |\n\nIn context (menu bar, labels style): `Codex` over `⧖` instead of over `30%`. In the dropdown, the glyph replaces the percentage and the meter becomes a dashed track `╌╌╌╌`.\n\nThe exact drawings are on the canvas: Round 3 page → *Awaiting-update glyph options* — https://claude.ai/artifact/E9ZV6c1fjk6HKqyCJ9pMSM\nRecommendation: ⧖ Hourglass: it says 'waiting' most directly and cannot be mistaken for a button or a spinner.\nOptions: ⧖ Hourglass / ⋯ Three dots / ◌ Dashed ring\nSelected: ⧖ Hourglass\nNotes:\n```\n\n## Question 34\n\n```text\nRound: Reset glyph and colour thresholds\nQuestion: How should the colour thresholds be configured?\nDescription (Markdown source):\nYou chose configurable thresholds. The existing app already has one:\n\n| Model | Controls | Behaviour |\n| --- | --- | --- |\n| One warning threshold, critical derived (existing) | 1 slider, 50–95% used, default 75% | Orange at 75% used; red halfway to 100% (87.5%). The two can never be out of order. |\n| Separate warning and critical | 2 sliders | Full control; the app must keep critical above warning |\n\nThresholds are measured on usage used. When percentages show *remaining*, the Settings label reads in that convention (for example, 'orange at 25% left').\nRecommendation: Keep the existing single warning threshold with critical derived: one control, never misordered, already implemented and tested.\nOptions: One warning threshold, critical derived / Separate warning and critical thresholds\nSelected: One warning threshold, critical derived\nNotes:\n```\n\n## Question 35\n\n```text\nRound: Reset glyph and colour thresholds\nQuestion: Where should the threshold colours appear?\nDescription (Markdown source):\nThe closed menu bar is the at-a-glance surface; the dropdown is where you look closer. The existing app colours the menu bar figure. In icons mode, the icon stays monochrome and only the percentage takes the colour.\nRecommendation: Both the dropdown meters and the menu bar figures, so a warning is visible without opening the dropdown.\nOptions: Dropdown meters and menu bar figures / Dropdown meters only / Menu bar figures only\nSelected: Dropdown meters and menu bar figures\nNotes:\n```\n\n## Question 36\n\n```text\nRound: Reset glyph and colour thresholds\nQuestion: When a reading is both stale and past a threshold, which treatment wins?\nDescription (Markdown source):\nA stale reading dims. The existing app lets the warning colour override dimming, so staleness never mutes an alarm at the moment it matters most; below the threshold, stale still dims. The dropdown's clock glyph and age show staleness either way.\nRecommendation: Warning colour wins over dimming (the existing behaviour).\nOptions: Warning colour wins over dimming / Dimming always wins\nSelected: Warning colour wins over dimming\nNotes:\n```\n\n## Question 37\n\n```text\nRound: Reset glyph and colour thresholds\nQuestion: Should the warning and critical colours be fixed or user-chosen?\nDescription (Markdown source):\nFixed system orange and red adapt to light mode, dark mode and accessibility contrast settings automatically. User-chosen colours add two colour pickers to Settings.\nRecommendation: Fixed system orange and red: native, adaptive, and no extra settings.\nOptions: Fixed system orange and red / User-chosen colours\nSelected: Fixed system orange and red\nNotes:\n```\n\n## Question 38\n\n```text\nRound: Reset glyph and colour thresholds\nQuestion: What colour should a meter be when it is below the warning threshold?\nDescription (Markdown source):\nThe mockups use blue. With threshold colours in play, colour can mean 'needs attention' only.\n\n| Option | Effect |\n| --- | --- |\n| Neutral (text colour) | Orange and red always stand out; calmest at rest |\n| System accent colour | Most 'native', but an orange or red accent would look like a warning |\n| Fixed blue | Consistent everywhere; ignores the user's accent |\nRecommendation: Neutral: colour then appears only when something needs attention, whatever accent colour you use.\nOptions: Neutral (text colour) / System accent colour / Fixed blue\nSelected: Neutral (text colour)\nNotes:\n```\n","toc":[{"id":"question-25","title":"Question 25","depth":2},{"id":"question-34","title":"Question 34","depth":2},{"id":"question-35","title":"Question 35","depth":2},{"id":"question-36","title":"Question 36","depth":2},{"id":"question-37","title":"Question 37","depth":2},{"id":"question-38","title":"Question 38","depth":2}],"titleAnchor":"interview-answers","links":[],"attachments":[],"html":"\u003cp>Submitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\u003c/p>\n\u003cp>Session: \u003ccode>94e43e24-0344-4592-9f1e-8eee6e7b6cb6\u003c/code>\u003c/p>\n\u003ch2 id=\"question-25\">Question 25\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Reset glyph and colour thresholds\nQuestion: Which glyph should mark a window whose reset time has passed while it waits for new data?\nDescription (Markdown source):\nAsked again with the glyphs visible. This form can't show images or SVG (it renders Markdown only), so these are close Unicode look-alikes:\n\n# ⧖ · ⋯ · ◌\n\n| Glyph | Name | Reads as | Native SF Symbol |\n| --- | --- | --- | --- |\n| ⧖ | Hourglass | Waiting for the next reading | `hourglass` |\n| ⋯ | Three dots | Pending; the lightest mark | `ellipsis` |\n| ◌ | Dashed ring | An empty value; may resemble a loading spinner | `circle.dashed` |\n\nIn context (menu bar, labels style): `Codex` over `⧖` instead of over `30%`. In the dropdown, the glyph replaces the percentage and the meter becomes a dashed track `╌╌╌╌`.\n\nThe exact drawings are on the canvas: Round 3 page → *Awaiting-update glyph options* — https://claude.ai/artifact/E9ZV6c1fjk6HKqyCJ9pMSM\nRecommendation: ⧖ Hourglass: it says 'waiting' most directly and cannot be mistaken for a button or a spinner.\nOptions: ⧖ Hourglass / ⋯ Three dots / ◌ Dashed ring\nSelected: ⧖ Hourglass\nNotes:\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-34\">Question 34\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Reset glyph and colour thresholds\nQuestion: How should the colour thresholds be configured?\nDescription (Markdown source):\nYou chose configurable thresholds. The existing app already has one:\n\n| Model | Controls | Behaviour |\n| --- | --- | --- |\n| One warning threshold, critical derived (existing) | 1 slider, 50–95% used, default 75% | Orange at 75% used; red halfway to 100% (87.5%). The two can never be out of order. |\n| Separate warning and critical | 2 sliders | Full control; the app must keep critical above warning |\n\nThresholds are measured on usage used. When percentages show *remaining*, the Settings label reads in that convention (for example, 'orange at 25% left').\nRecommendation: Keep the existing single warning threshold with critical derived: one control, never misordered, already implemented and tested.\nOptions: One warning threshold, critical derived / Separate warning and critical thresholds\nSelected: One warning threshold, critical derived\nNotes:\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-35\">Question 35\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Reset glyph and colour thresholds\nQuestion: Where should the threshold colours appear?\nDescription (Markdown source):\nThe closed menu bar is the at-a-glance surface; the dropdown is where you look closer. The existing app colours the menu bar figure. In icons mode, the icon stays monochrome and only the percentage takes the colour.\nRecommendation: Both the dropdown meters and the menu bar figures, so a warning is visible without opening the dropdown.\nOptions: Dropdown meters and menu bar figures / Dropdown meters only / Menu bar figures only\nSelected: Dropdown meters and menu bar figures\nNotes:\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-36\">Question 36\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Reset glyph and colour thresholds\nQuestion: When a reading is both stale and past a threshold, which treatment wins?\nDescription (Markdown source):\nA stale reading dims. The existing app lets the warning colour override dimming, so staleness never mutes an alarm at the moment it matters most; below the threshold, stale still dims. The dropdown's clock glyph and age show staleness either way.\nRecommendation: Warning colour wins over dimming (the existing behaviour).\nOptions: Warning colour wins over dimming / Dimming always wins\nSelected: Warning colour wins over dimming\nNotes:\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-37\">Question 37\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Reset glyph and colour thresholds\nQuestion: Should the warning and critical colours be fixed or user-chosen?\nDescription (Markdown source):\nFixed system orange and red adapt to light mode, dark mode and accessibility contrast settings automatically. User-chosen colours add two colour pickers to Settings.\nRecommendation: Fixed system orange and red: native, adaptive, and no extra settings.\nOptions: Fixed system orange and red / User-chosen colours\nSelected: Fixed system orange and red\nNotes:\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-38\">Question 38\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Reset glyph and colour thresholds\nQuestion: What colour should a meter be when it is below the warning threshold?\nDescription (Markdown source):\nThe mockups use blue. With threshold colours in play, colour can mean 'needs attention' only.\n\n| Option | Effect |\n| --- | --- |\n| Neutral (text colour) | Orange and red always stand out; calmest at rest |\n| System accent colour | Most 'native', but an orange or red accent would look like a warning |\n| Fixed blue | Consistent everywhere; ignores the user's accent |\nRecommendation: Neutral: colour then appears only when something needs attention, whatever accent colour you use.\nOptions: Neutral (text colour) / System accent colour / Fixed blue\nSelected: Neutral (text colour)\nNotes:\n\u003c/code>\u003c/pre>\n","backlinks":["index","plan"]},{"id":"verification/runs/2026-10-21-v0.2.0-preflight","title":"0.2.0 release preflight","section":"Verification","order":0,"metadata":{"result":"Untested"},"metadataHtml":"\u003cspan>Result: Untested\u003c/span> \u003cspan>Last updated: 2026-10-21\u003c/span>","updated":"2026-10-21","summary":"","source":"---\ntitle: 0.2.0 release preflight\nupdated: 2026-10-21\nresult: Untested\n---\n\n# 0.2.0 release preflight\n\nScope: [FEAT-release](../../features/release.md), the requested native redesign release and version bump. Packaging, migration-related core checks, tap behavior, selected native interactions, and existing live profiles were selected because they can block a usable release. This is not an exhaustive accessibility or operating-system certification.\n\n## Build identity\n\nVersion **0.2.0**, dirty working tree based on `9a1bbf5`. The [source manifest and environment](../../evidence/2026-10-21-v0.2.0-preflight/build-identity.json) fingerprint all product, test, build, and workflow inputs. The [package record](../../evidence/2026-10-21-v0.2.0-preflight/package.json) identifies the exact universal binary and DMG. UI checks used that DMG's copied binary on the current Apple Silicon host.\n\nThe candidate was then committed as `efff2d1` and pushed in [draft PR #1](https://github.com/rengwu/yacht/pull/1). GitHub CI passed for that commit on the configured macOS 15 runner.\n\n## Results\n\n| Scenario | Expected | Observed | Result | Evidence |\n| --- | --- | --- | --- | --- |\n| Core behavior and migration | All checks pass | 448 passed, zero failed | Passed | [Core log](../../evidence/2026-10-21-v0.2.0-preflight/core-tests.log) |\n| GitHub pull-request CI | Build, core tests, and tap tests pass | Completed successfully: 448 core and 21 tap checks passed | Passed | [Run metadata](../../evidence/2026-10-21-v0.2.0-preflight/ci.json), [summary](../../evidence/2026-10-21-v0.2.0-preflight/ci-summary.log) |\n| Claude tap | Silent, atomic, account-specific writes | 21 passed, zero failed | Passed | [Tap log](../../evidence/2026-10-21-v0.2.0-preflight/tap-tests.log) |\n| Intel core execution | Same suite succeeds under Rosetta | 448 passed, zero failed | Passed | [Intel log](../../evidence/2026-10-21-v0.2.0-preflight/intel-tests.log) |\n| Universal versioned bundle | Both slices, version 0.2.0, valid signature and resources | All checks passed | Passed | [Build](../../evidence/2026-10-21-v0.2.0-preflight/build.log), [package](../../evidence/2026-10-21-v0.2.0-preflight/package.json) |\n| DMG contents and relocation | App and Applications link; copied app matches and launches | Copied app hash matched; signature and launch passed | Passed | [Package](../../evidence/2026-10-21-v0.2.0-preflight/package.json), [UI checks](../../evidence/2026-10-21-v0.2.0-preflight/ui-checks.json) |\n| Native interactions | First-click rename and percentage controls update the display | Rename, Remaining, and usage menu accessibility updated correctly | Passed | [UI checks](../../evidence/2026-10-21-v0.2.0-preflight/ui-checks.json) |\n| Existing data preservation | Demo does not change saved config | Before/after hashes matched; normal instance restored | Passed | [UI checks](../../evidence/2026-10-21-v0.2.0-preflight/ui-checks.json) |\n| Kimi discovery | Current and credential-bearing legacy folders appear | Both listed; current registration identified; sheet cancelled | Passed | [UI checks](../../evidence/2026-10-21-v0.2.0-preflight/ui-checks.json) |\n| Claude live source | Installed tap and readable active usage snapshot | Installed; snapshot parsed with two active windows; normal app shows usage | Passed | [Provider checks](../../evidence/2026-10-21-v0.2.0-preflight/providers.json), [UI checks](../../evidence/2026-10-21-v0.2.0-preflight/ui-checks.json) |\n| Codex normal app | Registered account displays usage | Normal app displays a percentage | Passed | [UI checks](../../evidence/2026-10-21-v0.2.0-preflight/ui-checks.json) |\n| Grok live request | Existing credential fetches a valid usage response | HTTP 200; production parser accepted payload; normal app shows usage | Passed | [Provider checks](../../evidence/2026-10-21-v0.2.0-preflight/providers.json) |\n| Fresh Kimi request | Existing signed-in profile returns current usage | Both saved credentials expired; cached UI figure does not prove a fresh request | Untested | [Provider checks](../../evidence/2026-10-21-v0.2.0-preflight/providers.json) |\n\n## Limits and next action\n\nNo exercised product expectation failed. The aggregate is **Untested** because the selected fresh Kimi check lacks a live credential. The user must renew the intended Kimi profile through its CLI before that check can run, or explicitly accept the gap for publication.\n\nThe DMG was built with Finder styling skipped; its content and relocated app were checked. Pull-request CI passed remotely. The revised tag-release workflow has been syntax-checked and its build/test commands exercised locally, but it has not run remotely because no release tag has been pushed. A quarantined download, macOS 13 runtime, physical Intel UI, VoiceOver, and an actual logout/login cycle remain outside this run. Ad-hoc signing and lack of notarization remain the existing distribution policy.\n\nNo release tag has been pushed and nothing has been published. The next consequential decision is whether to wait for fresh Kimi verification or publish with that limit disclosed.\n\n## Subsequent release decision\n\nAfter this preflight, the user merged PR #1 and instructed “i merged. lets release.” Version 0.2.0 was then published; see the separate [publication record](2026-10-21-v0.2.0-publication.md). This direct instruction resolved the publication decision. It does not change this run's results or establish a fresh Kimi check.\n","toc":[{"id":"build-identity","title":"Build identity","depth":2},{"id":"results","title":"Results","depth":2},{"id":"limits-and-next-action","title":"Limits and next action","depth":2},{"id":"subsequent-release-decision","title":"Subsequent release decision","depth":2}],"titleAnchor":"0-2-0-release-preflight","links":["features/release","verification/runs/2026-10-21-v0.2.0-publication"],"attachments":[{"path":"evidence/2026-10-21-v ted\u003c/strong> because the selected fresh Kimi check lacks a live credential. The user must renew the intended Kimi profile through its CLI before that check can run, or explicitly accept the gap for publication.\u003c/p>\n\u003cp>The DMG was built with Finder styling skipped; its content and relocated app were checked. Pull-request CI passed remotely. The revised tag-release workflow has been syntax-checked and its build/test commands exercised locally, but it has not run remotely because no release tag has been pushed. A quarantined download, macOS 13 runtime, physical Intel UI, VoiceOver, and an actual logout/login cycle remain outside this run. Ad-hoc signing and lack of notarization remain the existing distribution policy.\u003c/p>\n\u003cp>No release tag has been pushed and nothing has been published. The next consequential decision is whether to wait for fresh Kimi verification or publish with that limit disclosed.\u003c/p>\n\u003ch2 id=\"subsequent-release-decision\">Subsequent release decision\u003c/h2>\n\u003cp>After this preflight, the user merged PR #1 and instructed “i merged. lets release.” Version 0.2.0 was then published; see the separate \u003ca href=\"#/verification/runs/2026-10-21-v0.2.0-publication\">publication record\u003c/a>. This direct instruction resolved the publication decision. It does not change this run's results or establish a fresh Kimi check.\u003c/p>\n","backlinks":["index","plan","native-implementation","features/release","verification/runs/2026-10-21-v0.2.0-publication","verification/setup"]},{"id":"verification/runs/2026-10-21-v0.2.0-publication","title":"0.2.0 publication and download verification","section":"Verification","order":0,"metadata":{"result":"Passed"},"metadataHtml":"\u003cspan>Result: Passed\u003c/span> \u003cspan>Last updated: 2026-10-21\u003c/span>","updated":"2026-10-21","summary":"","source":"---\ntitle: 0.2.0 publication and download verification\nupdated: 2026-10-21\nresult: Passed\n---\n\n# 0.2.0 publication and download verification\n\nScope: [FEAT-release](../../features/release.md), publishing the merged release and verifying the actual downloadable artifacts. The user directly authorized publication after merging PR #1: “i merged. lets release.” This resolves the earlier release-choice form without treating it as a submitted interview.\n\n## Release identity\n\n[Yacht v0.2.0](https://github.com/rengwu/yacht/releases/tag/v0.2.0) was published at **2026-10-21 09:37:02 UTC** from merged commit `e3b7293eee042c4a71f6bfc03c853b6e9987e041`. The annotated tag points to that commit. It is the latest stable release, with `Yacht.dmg` and `yacht-v0.2.0.dmg` attached.\n\nThe user-supplied README screenshot was added afterward in commit `aa3dc2f`; its bytes match the supplied PNG. The README and image blobs were checked against GitHub after pushing. This documentation update does not change the tagged app.\n\n## Results\n\n| Scenario | Expected | Observed | Result | Evidence |\n| --- | --- | --- | --- | --- |\n| Merged main CI | Build and suites pass | Merge commit CI completed successfully | Passed | [Main CI](https://github.com/rengwu/yacht/actions/runs/39557242710) |\n| Tag workflow | Version matches; tests, build, DMG creation and publication succeed | 448 core and 21 tap checks passed; all workflow steps succeeded | Passed | [Release workflow](https://github.com/rengwu/yacht/actions/runs/39578082672), [metadata](../../evidence/2026-10-21-v0.2.0-publication/workflow.json), [summary](../../evidence/2026-10-21-v0.2.0-publication/workflow-summary.log) |\n| Public downloads | README's stable link and versioned asset return the same complete DMG | Both downloaded; sizes and SHA-256 match GitHub asset metadata and each other | Passed | [Package record](../../evidence/2026-10-21-v0.2.0-publication/package.json) |\n| Disk image and bundle | Valid image, app and Applications link; correct version and resources | Image verified and mounted read-only; extracted app is 0.2.0, targets macOS 13, and includes all six resources | Passed | [Package record](../../evidence/2026-10-21-v0.2.0-publication/package.json) |\n| Universal executable and signing | arm64 and x86_64; strict signature verification passes after extraction | Both slices present; `codesign --verify --deep --strict` succeeded | Passed | [Package record](../../evidence/2026-10-21-v0.2.0-publication/package.json) |\n\nEach published DMG is **1,017,477 bytes**, with SHA-256 `0be23b8fc3b3e6a4f557afbd503ed8c693a7faf3d3f8955d4add1d23ba0d61d1`. The temporary mount was ejected. No installed application or account data was changed for these checks.\n\n## Limits\n\nThis run verifies publication and downloaded package structure. It did not launch the downloaded app, exercise Gatekeeper, or repeat UI/provider checks. The separate [preflight](2026-10-21-v0.2.0-preflight.md) records local packaged-app UI checks and the still-untested fresh Kimi request. Ad-hoc signing without notarization remains the existing distribution policy.\n","toc":[{"id":"release-identity","title":"Release identity","depth":2},{"id":"results","title":"Results","depth":2},{"id":"limits","title":"Limits","depth":2}],"titleAnchor":"0-2-0-publication-and-download-verification","links":["features/release","verification/runs/2026-10-21-v0.2.0-preflight"],"attachments":[{"path":"evidence/2026-10-21-v0.2.0-publication/workflow.json","sha256":"4962cb8b356ab602cff387c0a37d4d6ef5e8f6978402d7f4636ef538631c8cdf"},{"path":"evidence/2026-10-21-v0.2.0-publication/workflow-summary.log","sha256":"a6c536e1d338af3318855ebc0aa4c3bcc18d35d89e11c3862ccead5df49e741b"},{"path":"evidence/2026-10-21-v0.2.0-publication/package.json","sha256":"b845c2b768631bab543672ca2339cd97c1b6570c59dfb62a72768b78f0d09f81"}],"html":"\u003cp>Scope: \u003ca href=\"#/features/release\">FEAT-release\u003c/a>, publishing the merged release and verifying the actual downloadable artifacts. The user directly authorized publication after merging PR #1: “i merged. lets release.” This resolves the earlier release-choice form without treating it as a submitted interview.\u003c/p>\n\u003ch2 id=\"release-identity\">Release identity\u003c/h2>\n\u003cp>\u003ca href=\"https://github.com/rengwu/yacht/releases/tag/v0.2.0\" rel=\"noreferrer\">Yacht v0.2.0\u003c/a> was published at \u003cstrong>2026-10-21 09:37:02 UTC\u003c/strong> from merged commit \u003ccode>e3b7293eee042c4a71f6bfc03c853b6e9987e041\u003c/code>. The annotated tag points to that commit. It is the latest stable release, with \u003ccode>Yacht.dmg\u003c/code> and \u003ccode>yacht-v0.2.0.dmg\u003c/code> attached.\u003c/p>\n\u003cp>The user-supplied README screenshot was added afterward in commit \u003ccode>aa3dc2f\u003c/code>; its bytes match the supplied PNG. The README and image blobs were checked against GitHub after pushing. This documentation update does not change the tagged app.\u003c/p>\n\u003ch2 id=\"results\">Results\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Scenario\u003c/th>\n\u003cth>Expected\u003c/th>\n\u003cth>Observed\u003c/th>\n\u003cth>Result\u003c/th>\n\u003cth>Evidence\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Merged main CI\u003c/td>\n\u003ctd>Build and suites pass\u003c/td>\n\u003ctd>Merge commit CI completed successfully\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"https://github.com/rengwu/yacht/actions/runs/39557242710\" rel=\"noreferrer\">Main CI\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Tag workflow\u003c/td>\n\u003ctd>Version matches; tests, build, DMG creation and publication succeed\u003c/td>\n\u003ctd>448 core and 21 tap checks passed; all workflow steps succeeded\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"https://github.com/rengwu/yacht/actions/runs/39578082672\" rel=\"noreferrer\">Release workflow\u003c/a>, \u003ca href=\"evidence/2026-10-21-v0.2.0-publication/workflow.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 4962cb8b356ab602cff387c0a37d4d6ef
