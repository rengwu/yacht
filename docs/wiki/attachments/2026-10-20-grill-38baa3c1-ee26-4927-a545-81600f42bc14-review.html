kly\"}, {\"id\": \"kimi\", \"label\": \"Kimi\", \"provider\": \"Kimi\", \"path\": \"~/.kimi-code\", \"quota\": \"5h\"}], \"selected\": \"home\", \"appearance\": \"dark\", \"next\": 1}, expanded = false;\nlet state = structuredClone(window.grill?.state || initial);\nconst rows = document.querySelector('#rows'), theme = document.querySelector('#appearance');\nlet dragging = null;\nconst save = () => window.grill?.setState(structuredClone(state));\nfunction syncSelection(){\n  rows.querySelectorAll('.account-row').forEach(row=>{\n    const on=row.dataset.id===state.selected;\n    row.classList.toggle('selected',on);row.setAttribute('aria-selected',String(on));\n  });\n  const selected=state.accounts.find(a=>a.id===state.selected);\n  document.querySelector('#folder-path').textContent=selected?.path||'Select an account';\n  document.querySelector('#remove').disabled=!selected;\n  document.querySelector('#add').disabled=state.accounts.length>=8;\n}\nfunction select(id){state.selected=id;syncSelection();save()}\nfunction render(){\n  document.body.classList.toggle('light',state.appearance==='light');\n  theme.value=state.appearance;\n  rows.replaceChildren();\n  for(const account of state.accounts){\n    const row=document.createElement('div');row.className='account-row';row.dataset.id=account.id;\n    row.role='row';row.tabIndex=0;\n    const identity=document.createElement('div');identity.className='identity';identity.role='cell';\n    const handle=document.createElement('span');handle.className='grip';handle.draggable=true;\n    handle.innerHTML=\"\u003csvg viewBox=\\\"0 0 12 12\\\" fill=\\\"none\\\" stroke=\\\"currentColor\\\" stroke-width=\\\"1\\\">\u003cpath d=\\\"M1 3h10M1 6h10M1 9h10\\\"/>\u003c/svg>\";handle.title='Drag to reorder';\n    handle.addEventListener('dragstart',event=>{dragging=account.id;event.dataTransfer.setData('text/plain',account.id);event.dataTransfer.effectAllowed='move';select(account.id)});\n    const mark=document.createElement('span');mark.className='mark';mark.innerHTML=icons[account.provider];mark.setAttribute('aria-hidden','true');\n    const texts=document.createElement('div');texts.className='name-and-path';\n    const input=document.createElement('input');input.className='name';input.value=account.label;input.setAttribute('aria-label','Label for '+account.path);\n    input.addEventListener('focus',()=>select(account.id));\n    input.addEventListener('input',()=>{account.label=input.value;save()});\n    input.addEventListener('keydown',event=>{if(event.key==='Enter')input.blur()});\n    input.addEventListener('blur',()=>{account.label=input.value.trim()||account.provider;input.value=account.label;save()});\n    texts.append(input);\n    if(expanded){const path=document.createElement('div');path.className='path';path.textContent=account.path;path.title=account.path;texts.append(path)}\n    identity.append(handle,mark,texts);\n    const provider=document.createElement('div');provider.className='provider';provider.role='cell';provider.textContent=account.provider;\n    const wrap=document.createElement('div');wrap.className='quota-wrap';wrap.role='cell';\n    const quota=document.createElement('select');quota.className='quota';quota.setAttribute('aria-label','Menu bar window for '+account.label);\n    for(const value of account.provider==='Grok'?['Weekly','Off']:['5h','Weekly','Off']){\n      const option=document.createElement('option');option.textContent=value;option.selected=value===account.quota;quota.append(option)\n    }\n    quota.addEventListener('focus',()=>select(account.id));\n    quota.addEventListener('change',()=>{account.quota=quota.value;save()});\n    wrap.append(quota);wrap.insertAdjacentHTML('beforeend',\"\u003csvg class=\\\"chevrons\\\" viewBox=\\\"0 0 8 12\\\" fill=\\\"none\\\" stroke=\\\"currentColor\\\" stroke-width=\\\"1.5\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\">\u003cpath d=\\\"m1 4 3-3 3 3M1 8l3 3 3-3\\\"/>\u003c/svg>\");\n    row.append(identity,provider,wrap);\n    row.addEventListener('click',()=>select(account.id));\n    row.addEventListener('keydown',event=>{\n      if(event.target!==row)return;\n      const index=state.accounts.findIndex(a=>a.id===account.id),direction=event.key==='ArrowDown'?1:event.key==='ArrowUp'?-1:0;\n      if(direction){event.preventDefault();const next=state.accounts[Math.max(0,Math.min(state.accounts.length-1,index+direction))];select(next.id);rows.querySelector('[data-id=\"'+next.id+'\"]').focus()}\n      if(event.key==='Enter'){event.preventDefault();input.focus();input.select()}\n    });\n    row.addEventListener('dragover',event=>{if(!dragging)return;event.preventDefault();row.classList.toggle('drop-before',event.clientY\u003crow.getBoundingClientRect().top+row.offsetHeight/2);row.classList.toggle('drop-after',!row.classList.contains('drop-before'))});\n    row.addEventListener('dragleave',()=>row.classList.remove('drop-before','drop-after'));\n    row.addEventListener('drop',event=>{\n      event.preventDefault();if(!dragging)return;\n      const item=state.accounts.find(a=>a.id===dragging);if(!item)return;\n      if(dragging!==account.id){\n        const after=event.clientY>=row.getBoundingClientRect().top+row.offsetHeight/2;\n        state.accounts=state.accounts.filter(a=>a.id!==dragging);\n        state.accounts.splice(state.accounts.findIndex(a=>a.id===account.id)+(after?1:0),0,item);\n      }\n      dragging=null;save();render()\n    });\n    row.addEventListener('dragend',()=>{dragging=null;rows.querySelectorAll('.account-row').forEach(r=>r.classList.remove('drop-before','drop-after'))});\n    rows.append(row)\n  }\n  syncSelection();\n}\ntheme.addEventListener('change',()=>{state.appearance=theme.value;save();render()});\ndocument.querySelector('#reset').addEventListener('click',()=>{state=structuredClone(initial);save();render()});\ndocument.querySelector('#add').addEventListener('click',()=>{\n  if(state.accounts.length>=8)return;const n=state.next++;\n  const account={id:'sample-'+n,label:n===1?'Client':'Client '+n,provider:'Claude',path:'~/.claude-client-'+n,quota:'5h'};\n  state.accounts.push(account);state.selected=account.id;save();render()\n});\ndocument.querySelector('#remove').addEventListener('click',()=>{\n  const index=state.accounts.findIndex(a=>a.id===state.selected);\n  if(index\u003c0)return;state.accounts.splice(index,1);state.selected=state.accounts[Math.min(index,state.accounts.length-1)]?.id||null;save();render()\n});\nrender();\n\u003c/script>\u003c/body>\u003c/html>","height":395,"anchors":[],"state":{"accounts":[{"id":"work","label":"Work","provider":"Claude","path":"~/.claude-work","quota":"5h"},{"id":"home","label":"Home","provider":"Claude","path":"~/.claude-home","quota":"Weekly"},{"id":"codex","label":"Codex","provider":"Codex","path":"~/.codex","quota":"Weekly"},{"id":"grok","label":"Grok","provider":"Grok","path":"~/.grok","quota":"Weekly"},{"id":"kimi","label":"Kimi","provider":"Kimi","path":"~/.kimi-code","quota":"5h"}],"selected":"home","appearance":"dark","next":1}}},{"id":"paths","number":2,"prompt":"B · Folder paths always visible — what would you change?","context":"The same native table treatment, with a second line for every folder path. It is easier to distinguish several profiles at a glance, but rows take more space. The rounded group, subtle striping, plain labels, and quiet menu-bar controls match A.","recommendation":"","options":[],"required":false,"preview":{"html":"\u003c!doctype html>\u003chtml>\u003chead>\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\u003cstyle>\n*{box-sizing:border-box}\n:root{color-scheme:dark;--canvas:#22242d;--group:#292b35;--stripe:#30323d;--head:#343640;--text:#ededf1;--secondary:#a0a1ab;--button:#393b45;--line:#ffffff14;--selected:#2558c8;--field:#181b26}\nbody.light{color-scheme:light;--canvas:#f4f4f6;--group:#fff;--stripe:#f0f0f3;--head:#e8e8ed;--text:#202124;--secondary:#73737c;--button:#fff;--line:#00000014;--selected:#2 <script>
'use strict';
const state=JSON.parse(document.getElementById('grill-data').textContent);
const questions=state.spec.questions;
const storageKey='grill-form-'+state.sessionId;
const form=document.getElementById('questions');
const actions=document.getElementById('actions');
const submit=document.getElementById('submit');
const message=document.getElementById('message');
const title=document.getElementById('title');
document.getElementById('project-name').textContent=state.projectName;
title.textContent=state.spec.title;document.title=state.projectName+' — '+state.spec.title;
let answers=questions.map(q=>({questionId:q.id,choiceId:null,notes:''}));
try{
 const draft=state.archived ? state.savedAnswers : JSON.parse(sessionStorage.getItem(storageKey));
 if(Array.isArray(draft)&&draft.length===questions.length&&draft.every((a,i)=>a&&a.questionId===questions[i].id&&typeof a.notes==='string'&&a.notes.length<=12000&&validReviewDraft(a,questions[i])&&(a.choiceId===null||a.choiceId==='other'||questions[i].options.some(o=>o.id===a.choiceId))))answers=draft;
}catch{} // Some browsers restrict storage on file://; in-memory editing still works.
try{restoreImages()}catch{answers=questions.map(q=>({questionId:q.id,choiceId:null,notes:''}));imageAssets.clear()}
function element(tag,text,className){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(className)node.className=className;return node}
const escapeHTML=text=>text.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let diagramNumber=0;
let diagramQueue=Promise.resolve();
function diagramFallback(container,source,reason){
 container.replaceChildren(element('p','Diagram could not be rendered. '+reason,'diagram-error'));
 const details=element('details');details.open=true;
 const pre=element('pre');pre.append(element('code',source));
 details.append(element('summary','Diagram source'),pre);container.append(details);container.dataset.renderState='error';
}
async function renderDiagram(container,source){
 if(/%%\s*\{/.test(source)||/^\s*---/.test(source)){
  diagramFallback(container,source,'Use Mermaid syntax without configuration directives.');return;
 }
 try{
  const {svg}=pele.render(source,{idPrefix:'grill-diagram-'+(++diagramNumber),links:false,images:false,autoDirection:false,limit:12000,maxEdges:150,outputLimit:1000000});
  container.innerHTML=DOMPurify.sanitize(svg,{USE_PROFILES:{svg:true,svgFilters:true},FORBID_TAGS:['foreignObject','image','a','style']});
  const drawing=container.querySelector('svg');
  const width=drawing?.viewBox.baseVal.width;
  if(width){drawing.style.width=Math.ceil(width)+'px';drawing.style.maxWidth='';}
  container.dataset.renderState='ready';
 }catch{diagramFallback(container,source,'You can still answer this question.');}
}
function description(source,number){
 const wrapper=element('section',undefined,'description');wrapper.setAttribute('aria-label','Description for question '+number);
 const content=element('div',undefined,'rich-content');content.id='description-'+number;wrapper.append(content);
 try{
  const renderer=new marked.Renderer();
  renderer.html=({text})=>escapeHTML(text);
  renderer.image=({text})=>escapeHTML(text);
  const html=marked.parse(source,{gfm:true,breaks:false,renderer});
  content.innerHTML=DOMPurify.sanitize(html,{ALLOWED_TAGS:['p','br','strong','em','del','a','ul','ol','li','blockquote','h1','h2','h3','h4','h5','h6','pre','code','table','thead','tbody','tr','th','td','hr'],ALLOWED_ATTR:['href','title','class','align','start']});
  content.querySelectorAll('a').forEach(link=>{if(!/^https?:\/\//i.test(link.getAttribute('href')||'')){link.removeAttribute('href');return;}link.target='_blank';link.rel='noopener noreferrer';});
  content.querySelectorAll('pre > code.language-mermaid').forEach(code=>{
   const diagram=element('div','Rendering diagram…','diagram');diagram.dataset.renderState='pending';diagram.tabIndex=0;diagram.setAttribute('role','region');diagram.setAttribute('aria-label','Diagram for question '+number);
   const definition=code.textContent;code.parentElement.replaceWith(diagram);
   diagramQueue=diagramQueue.then(()=>renderDiagram(diagram,definition)).catch(()=>diagramFallback(diagram,definition,'You can still answer this question.'));
  });
 }catch{content.append(element('p','Description could not be rendered; original source follows.','error'),element('pre',source));}
 const hasDiagram=!!content.querySelector('.diagram'),wideContent=[...content.querySelectorAll('table,pre')];
 if(!hasDiagram&&!wideContent.length)return wrapper;
 const toolbar=element('div',undefined,'description-toolbar');
 const expand=element('button',undefined,'expand');expand.type='button';expand.setAttribute('aria-controls',content.id);
 const icon=document.createElementNS('http://www.w3.org/2000/svg','svg');icon.setAttribute('viewBox','0 0 24 24');icon.setAttribute('fill','none');icon.setAttribute('stroke','currentColor');icon.setAttribute('stroke-width','1.75');icon.setAttribute('stroke-linecap','round');icon.setAttribute('stroke-linejoin','round');icon.setAttribute('aria-hidden','true');
 const iconPath=document.createElementNS('http://www.w3.org/2000/svg','path');icon.append(iconPath);expand.append(icon);
 function refresh(){
  const expanded=wrapper.classList.contains('is-expanded');
  const available=expanded||hasDiagram||wideContent.some(node=>node.scrollWidth>content.clientWidth+1);

 }

function complete(a){return a.choiceId==='other'?!!a.notes.trim():!!a.choiceId||!!a.notes.trim()}

 if(state.archived)return;

 }
}
questions.forEach((q,i)=>{

 (q.options.length?[...q.options,{id:'other',label:'Something else'}]:[]).forEach(option=>{
  const label=element('label',undefined,'choice');
  const radio=element('input');radio.type='radio';radio.name=q.id;radio.value=option.id;radio.checked=answers[i].choiceId===option.id;
  radio.addEventListener('change',()=>{answers[i].choiceId=option.id;clear.hidden=false;update()});
  label.append(radio,element('span',option.label));
  if(option.preview){const card=element('div',undefined,'choice-card');const select=()=>{if(!state.archived&&!radio.checked)radio.click()};card.addEventListener('click',select);card.append(renderPreview(option.preview,i,'option-'+option.id,comments.add,select),label);choices.append(card)}else choices.append(label);
 });
 if(clear){clear.type='button';clear.hidden=state.archived||!answers[i].choiceId;clear.addEventListener('click',()=>{const chosen=choices.querySelector('input:checked');answers[i].choiceId=null;choices.querySelectorAll('input').forEach(r=>r.checked=false);clear.hidden=true;update();chosen?.focus()});choices.append(clear)}
 const notesLabel=element('div','Notes','notes-label');

});
if(state.review){const hint=element('p',state.archived?'Saved review. Feedback and prototype state are restored below.':'Share feedback on any item. Untouched items remain open.','review-hint');document.querySelector('header').append(hint)}
if(state.archived){actions.hidden=true;form.querySelectorAll('input,select,button:not(.expand):not(.view-comment)').forEach(node=>node.disabled=true);form.querySelectorAll('[contenteditable]').forEach(node=>node.contentEditable='false')}

form.addEventListener('submit',event=>{

 if(!canSubmit()||!notesReady())return;
 try{
  const payload={schemaVersion:1,sessionId:state.sessionId,specDigest:state.specDigest,answers};
  const blob=new Blob([JSON.stringify(payload,null,2)+'\n'],{type:'application/json'});
  const url=URL.createObjectURL(blob),link=element('a');
  link.href=url;link.download='grill-form-'+state.sessionId+'.json';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
  submit.textContent='Download answers again';message.className='confirmation';message.textContent='Save the answer file to Downloads, then return to the conversation. This page cannot confirm receipt.';message.hidden=false;message.focus();
  try{sessionStorage.removeItem(storageKey)}catch{}
